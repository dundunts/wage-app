openapi: 3.0.3
info:
  title: Wage App API
  version: 0.1.0
  description: >-
    Draft baseline for the authenticated Company, Employee, Shift Session, and
    Checkpoint operations currently provided by Wage App. This contract is not
    yet the complete /api/v1 contract.
servers:
  - url: /
    description: Current Wage App server
tags:
  - name: Company
    description: Operations for a work location whose shifts and pay are accounted independently.
  - name: Employee
    description: Operations for people whose work and pay are accounted by Companies.
  - name: Shift Session
    description: Operations for a Company's team-based work accounting session.
  - name: Checkpoint
    description: Operations for boundaries that end Shift Intervals and record their teams and totals.
security:
  - BearerAuth: []
paths:
  /api/v1/company/get/{id}:
    $ref: ./paths/company.yaml#/GetCompany
  /api/v1/company/get/for-user:
    $ref: ./paths/company.yaml#/GetCompaniesForUser
  /api/v1/company/get/page:
    $ref: ./paths/company.yaml#/GetCompaniesPage
  /api/v1/company/create:
    $ref: ./paths/company.yaml#/CreateCompany
  /api/v1/company/update/{id}:
    $ref: ./paths/company.yaml#/UpdateCompany
  /api/v1/company/delete/{id}:
    $ref: ./paths/company.yaml#/DeleteCompany
  /api/v1/employee/get/{id}:
    $ref: ./paths/employee.yaml#/GetEmployee
  /api/v1/employee/get/all:
    $ref: ./paths/employee.yaml#/GetAllEmployees
  /api/v1/employee/get/by-companies:
    $ref: ./paths/employee.yaml#/GetEmployeesByCompanies
  /api/v1/employee/get/coworkers:
    $ref: ./paths/employee.yaml#/GetCoworkers
  /api/v1/employee/create:
    $ref: ./paths/employee.yaml#/CreateEmployee
  /api/v1/employee/update/{id}:
    $ref: ./paths/employee.yaml#/UpdateEmployee
  /api/v1/employee/bind-user/{employeeId}:
    $ref: ./paths/employee.yaml#/BindEmployeeUser
  /api/v1/employee/delete/{id}:
    $ref: ./paths/employee.yaml#/DeleteEmployee
  /api/v1/session/get/opened:
    $ref: ./paths/shift-session.yaml#/GetOpenedShiftSession
  /api/v1/session/get/available/{sessionId}:
    $ref: ./paths/shift-session.yaml#/GetAvailableShiftSession
  /api/v1/session/get/available/all:
    $ref: ./paths/shift-session.yaml#/GetAvailableShiftSessions
  /api/v1/session/open:
    $ref: ./paths/shift-session.yaml#/OpenShiftSession
  /api/v1/session/recalculating:
    $ref: ./paths/shift-session.yaml#/OpenShiftSessionRecalculation
  /api/v1/session/{sessionId}/close:
    $ref: ./paths/shift-session.yaml#/CloseShiftSession
  /api/v1/session/update/time:
    $ref: ./paths/shift-session.yaml#/UpdateShiftSessionStart
  /api/v1/checkpoint/create:
    $ref: ./paths/checkpoint.yaml#/CreateCheckpoint
  /api/v1/checkpoint/update:
    $ref: ./paths/checkpoint.yaml#/UpdateCheckpoint
  /api/v1/checkpoint/{checkpointId}/delete:
    $ref: ./paths/checkpoint.yaml#/DeleteCheckpoint
components:
  securitySchemes:
    BearerAuth:
      $ref: ./components/security-schemes.yaml#/BearerAuth
  parameters:
    CompanyId:
      $ref: ./components/parameters.yaml#/CompanyId
    EmployeeId:
      $ref: ./components/parameters.yaml#/EmployeeId
    EmployeeBindingId:
      $ref: ./components/parameters.yaml#/EmployeeBindingId
    CompanyIds:
      $ref: ./components/parameters.yaml#/CompanyIds
    UserId:
      $ref: ./components/parameters.yaml#/UserId
    ShiftSessionCompanyId:
      $ref: ./components/parameters.yaml#/ShiftSessionCompanyId
    ShiftSessionId:
      $ref: ./components/parameters.yaml#/ShiftSessionId
    CheckpointId:
      $ref: ./components/parameters.yaml#/CheckpointId
    Page:
      $ref: ./components/parameters.yaml#/Page
    Size:
      $ref: ./components/parameters.yaml#/Size
    Sort:
      $ref: ./components/parameters.yaml#/Sort
  responses:
    BadRequest:
      $ref: ./components/responses.yaml#/BadRequest
    Unauthorized:
      $ref: ./components/responses.yaml#/Unauthorized
    Forbidden:
      $ref: ./components/responses.yaml#/Forbidden
    CompanyNotFound:
      $ref: ./components/responses.yaml#/CompanyNotFound
    CompanyConflict:
      $ref: ./components/responses.yaml#/CompanyConflict
    EmployeeNotFound:
      $ref: ./components/responses.yaml#/EmployeeNotFound
    UserBindingConflict:
      $ref: ./components/responses.yaml#/UserBindingConflict
    ShiftSessionResourceNotFound:
      $ref: ./components/responses.yaml#/ShiftSessionResourceNotFound
    ShiftSessionConflict:
      $ref: ./components/responses.yaml#/ShiftSessionConflict
    CheckpointResourceNotFound:
      $ref: ./components/responses.yaml#/CheckpointResourceNotFound
    CheckpointConflict:
      $ref: ./components/responses.yaml#/CheckpointConflict
  schemas:
    Company:
      $ref: ./components/schemas.yaml#/Company
    CompanyCreateOrUpdateRequest:
      $ref: ./components/schemas.yaml#/CompanyCreateOrUpdateRequest
    UserCompaniesResponse:
      $ref: ./components/schemas.yaml#/UserCompaniesResponse
    CompanyPage:
      $ref: ./components/schemas.yaml#/CompanyPage
    Position:
      $ref: ./components/schemas.yaml#/Position
    Employee:
      $ref: ./components/schemas.yaml#/Employee
    CompanyEmployee:
      $ref: ./components/schemas.yaml#/CompanyEmployee
    CompanyEmployees:
      $ref: ./components/schemas.yaml#/CompanyEmployees
    CreateEmployeeRequest:
      $ref: ./components/schemas.yaml#/CreateEmployeeRequest
    UpdateEmployeeRequest:
      $ref: ./components/schemas.yaml#/UpdateEmployeeRequest
    ProblemDetail:
      $ref: ./components/schemas.yaml#/ProblemDetail
    ShiftSession:
      $ref: ./components/schemas.yaml#/ShiftSession
    ShiftSessionStatus:
      $ref: ./components/schemas.yaml#/ShiftSessionStatus
    LocalDateTime:
      $ref: ./components/schemas.yaml#/LocalDateTime
    ShiftSessionStart:
      $ref: ./components/schemas.yaml#/ShiftSessionStart
    OpenShiftSessionRequest:
      $ref: ./components/schemas.yaml#/OpenShiftSessionRequest
    OpenShiftSessionRecalculationRequest:
      $ref: ./components/schemas.yaml#/OpenShiftSessionRecalculationRequest
    UpdateShiftSessionStartRequest:
      $ref: ./components/schemas.yaml#/UpdateShiftSessionStartRequest
    Checkpoint:
      $ref: ./components/schemas.yaml#/Checkpoint
    CheckpointFields:
      $ref: ./components/schemas.yaml#/CheckpointFields
    RegularCheckpoint:
      $ref: ./components/schemas.yaml#/RegularCheckpoint
    FinalCheckpoint:
      $ref: ./components/schemas.yaml#/FinalCheckpoint
    CheckpointType:
      $ref: ./components/schemas.yaml#/CheckpointType
    CheckpointEmployee:
      $ref: ./components/schemas.yaml#/CheckpointEmployee
    CheckpointMetricRecord:
      $ref: ./components/schemas.yaml#/CheckpointMetricRecord
    CheckpointMetricRecordRequest:
      $ref: ./components/schemas.yaml#/CheckpointMetricRecordRequest
    CheckpointMetricDestination:
      $ref: ./components/schemas.yaml#/CheckpointMetricDestination
    CreateCheckpointRequest:
      $ref: ./components/schemas.yaml#/CreateCheckpointRequest
    UpdateCheckpointRequest:
      $ref: ./components/schemas.yaml#/UpdateCheckpointRequest
