openapi: 3.0.3
info:
  title: Wage App API
  version: 0.1.0
  description: Complete canonical contract for all authenticated /api/v1 Company, Employee, Shift Session, Checkpoint, Shift Result Draft, Shift Result, and Payroll operations currently provided by Wage App.
servers:
  - url: /
    description: Current Wage App server
security:
  - BearerAuth: []
tags:
  - name: Company
    description: Operations for a work location whose shifts and pay are accounted independently.
  - name: Employee
    description: Operations for people whose work and pay are accounted by Companies.
  - name: Shift Session
    description: Operations for a Company's team-based work accounting session.
  - name: Checkpoint
    description: Operations for boundaries that end Shift Intervals and record their teams and totals.
  - name: Shift Result Draft
    description: Operations that calculate, inspect, confirm, and discard provisional employee Payments.
  - name: Shift Result
    description: Operations for confirmed employee Payments from one Company's Shift Session.
  - name: Payroll
    description: Operations for Employee Payments aggregated over a Payroll Period for one Company.
paths:
  /api/v1/company/get/{id}:
    get:
      tags:
        - Company
      operationId: getCompany
      summary: Get a Company
      description: Returns one Company by its identifier.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: The Company was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyNotFound'
  /api/v1/company/get/for-user:
    get:
      tags:
        - Company
      operationId: getCompaniesForUser
      summary: List the current user's Companies
      description: Returns the Companies associated with the authenticated User's Employee record.
      responses:
        '200':
          description: The Companies associated with the current User, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompaniesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/company/get/page:
    get:
      tags:
        - Company
      operationId: getCompaniesPage
      summary: List a page of Companies
      description: Returns a page of Companies. The response guarantees the page content, index, requested size, and total element count; additional Spring pagination fields may be present but are not part of the supported contract.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Companies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/company/create:
    post:
      tags:
        - Company
      operationId: createCompany
      summary: Create a Company
      description: Creates a Company with a unique title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateOrUpdateRequest'
      responses:
        '201':
          description: The Company was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CompanyConflict'
  /api/v1/company/update/{id}:
    put:
      tags:
        - Company
      operationId: updateCompany
      summary: Update a Company
      description: Replaces the editable fields of an existing Company.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateOrUpdateRequest'
      responses:
        '204':
          description: The Company was updated successfully. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyNotFound'
        '409':
          $ref: '#/components/responses/CompanyConflict'
  /api/v1/company/delete/{id}:
    delete:
      tags:
        - Company
      operationId: deleteCompany
      summary: Delete a Company
      description: Deletes a Company by identifier. Deleting an absent Company is also successful.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '204':
          description: The Company is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/get/{id}:
    get:
      tags:
        - Employee
      operationId: getEmployee
      summary: Get an Employee
      description: Returns one Employee, including all Company memberships and any User binding.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: The Employee was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
  /api/v1/employee/get/all:
    get:
      tags:
        - Employee
      operationId: getAllEmployees
      summary: List all Employees
      description: Returns every Employee, including Company memberships and User bindings.
      responses:
        '200':
          description: All Employees, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/get/by-companies:
    get:
      tags:
        - Employee
      operationId: getEmployeesByCompanies
      summary: List Employees by Company
      description: Returns Employees grouped by each requested Company. A Company without a matching Employee is omitted rather than returned with an empty collection.
      parameters:
        - $ref: '#/components/parameters/CompanyIds'
      responses:
        '200':
          description: Company groups that contain at least one matching Employee, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/CompanyEmployees'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/get/coworkers:
    get:
      tags:
        - Employee
      operationId: getCoworkers
      summary: List the current User's coworkers
      description: Returns Employees, including the current User's Employee, grouped by each Company shared with the current User. Returns an empty list when the User is not bound to an Employee or that Employee has no Company membership.
      responses:
        '200':
          description: Company groups containing the current User's coworkers, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/CompanyEmployees'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/create:
    post:
      tags:
        - Employee
      operationId: createEmployee
      summary: Create an Employee
      description: Creates an Employee and establishes the requested Company memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: The Employee was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/update/{id}:
    put:
      tags:
        - Employee
      operationId: updateEmployee
      summary: Update an Employee
      description: Replaces the Employee's editable details and full Company membership list. The request can also replace or remove the User binding.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '204':
          description: The Employee was updated successfully. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '409':
          $ref: '#/components/responses/UserBindingConflict'
  /api/v1/employee/bind-user/{employeeId}:
    put:
      tags:
        - Employee
      operationId: bindEmployeeUser
      summary: Bind an Employee to a User
      description: Replaces the Employee's User binding with the supplied external User identifier. Company memberships and Employee details are unchanged.
      parameters:
        - $ref: '#/components/parameters/EmployeeBindingId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The User was bound to the Employee. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '409':
          $ref: '#/components/responses/UserBindingConflict'
  /api/v1/employee/delete/{id}:
    delete:
      tags:
        - Employee
      operationId: deleteEmployee
      summary: Delete an Employee
      description: Deletes an Employee and its Company memberships by identifier. Deleting an absent Employee is also successful.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '204':
          description: The Employee is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session/get/opened:
    get:
      tags:
        - Shift Session
      operationId: getOpenedShiftSession
      summary: Get a Company's opened Shift Session
      description: Returns the Company's single Shift Session in `OPENED` or `OPENED_DRAFT` state. Multiple matching sessions are treated as a conflict rather than an arbitrary session being selected.
      parameters:
        - $ref: '#/components/parameters/ShiftSessionCompanyId'
      responses:
        '200':
          description: The Company's opened Shift Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/get/available/{sessionId}:
    get:
      tags:
        - Shift Session
      operationId: getAvailableShiftSession
      summary: Get an available Shift Session
      description: 'Returns a Shift Session only when it is available to the current workflow: `OPENED`, `OPENED_DRAFT`, `RECALCULATING`, or `RECALCULATING_DRAFT`.'
      parameters:
        - $ref: '#/components/parameters/ShiftSessionId'
      responses:
        '200':
          description: The available Shift Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/get/available/all:
    get:
      tags:
        - Shift Session
      operationId: getAvailableShiftSessions
      summary: List a Company's available Shift Sessions
      description: Returns every Shift Session in `OPENED`, `OPENED_DRAFT`, `RECALCULATING`, or `RECALCULATING_DRAFT` state. The collection is empty when none exist.
      parameters:
        - $ref: '#/components/parameters/ShiftSessionCompanyId'
      responses:
        '200':
          description: Available Shift Sessions, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/open:
    post:
      tags:
        - Shift Session
      operationId: openShiftSession
      summary: Open a new Shift Session
      description: Opens a Shift Session at the supplied local Shift Session Start. A Company cannot have another session in `OPENED` state. The start is the first time boundary and is not represented as a Checkpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftSessionRequest'
      responses:
        '201':
          description: The Shift Session was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/recalculating:
    post:
      tags:
        - Shift Session
      operationId: openShiftSessionRecalculation
      summary: Reopen a Shift Session for Recalculation
      description: Changes a `CLOSED` Shift Session to `RECALCULATING` so its Checkpoints can be changed and its Shift Result calculated again. This reopens the existing Shift Session; it does not create a second session or copy its Checkpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftSessionRecalculationRequest'
      responses:
        '201':
          description: The existing Shift Session was reopened for Recalculation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/{sessionId}/close:
    put:
      tags:
        - Shift Session
      operationId: closeShiftSession
      summary: Close a Shift Session
      description: 'Sets the Shift Session state to `CLOSED`. The current operation is idempotent with respect to session state: already closed and recalculating sessions are also left closed successfully.'
      parameters:
        - $ref: '#/components/parameters/ShiftSessionId'
      responses:
        '204':
          description: The Shift Session is closed. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/update/time:
    put:
      tags:
        - Shift Session
      operationId: updateShiftSessionStart
      summary: Update a Shift Session Start time
      description: Replaces only the local time portion of the Shift Session Start; the session date is unchanged. The current state must be `OPENED` or `RECALCULATING`, so the update is rejected while a Shift Result Draft exists or after closure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftSessionStartRequest'
      responses:
        '204':
          description: The Shift Session Start time was updated. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/checkpoint/create:
    post:
      tags:
        - Checkpoint
      operationId: createCheckpoint
      summary: Create a Checkpoint
      description: Creates a boundary in an `OPENED` or `RECALCULATING` Shift Session. The Checkpoint records the Employee team, accumulated Revenue, and accumulated Restaurant Tips for the Shift Interval that it ends. `FINAL` uses the same payload and allocation rules as `REGULAR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckpointRequest'
      responses:
        '201':
          description: The Checkpoint was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CheckpointResourceNotFound'
        '409':
          $ref: '#/components/responses/CheckpointConflict'
  /api/v1/checkpoint/update:
    post:
      tags:
        - Checkpoint
      operationId: updateCheckpoint
      summary: Update a Checkpoint
      description: Replaces a Checkpoint's boundary time, type, complete Employee team, accumulated Revenue, accumulated Restaurant Tips, and metric records. Its owning Shift Session must be in `OPENED` or `RECALCULATING` state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckpointRequest'
      responses:
        '200':
          description: The updated Checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CheckpointResourceNotFound'
        '409':
          $ref: '#/components/responses/CheckpointConflict'
  /api/v1/checkpoint/{checkpointId}/delete:
    delete:
      tags:
        - Checkpoint
      operationId: deleteCheckpoint
      summary: Delete a Checkpoint
      description: Deletes a Checkpoint only while its Shift Session is `OPENED` or `RECALCULATING`. Deleting an absent Checkpoint is also successful.
      parameters:
        - $ref: '#/components/parameters/CheckpointId'
      responses:
        '204':
          description: The Checkpoint is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CheckpointResourceNotFound'
        '409':
          $ref: '#/components/responses/CheckpointConflict'
  /api/v1/calculation/draft/for-session/{sessionId}:
    get:
      tags:
        - Shift Result Draft
      operationId: getOrCalculateShiftResultDraft
      summary: Get or calculate a Shift Result Draft
      description: Returns the existing Shift Result Draft for a Shift Session, or calculates and persists one when the Shift Session is open or being recalculated.
      parameters:
        - $ref: '#/components/parameters/ShiftSessionId'
      responses:
        '200':
          description: The existing or newly calculated Shift Result Draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResultDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftResultDraftResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftResultDraftConflict'
  /api/v1/calculation/draft/{id}/confirm:
    post:
      tags:
        - Shift Result Draft
      operationId: confirmShiftResultDraft
      summary: Confirm a Shift Result Draft
      description: Confirms a Shift Result Draft, creates a checkpoint-calculated Shift Result with its Payments, closes the Shift Session, and deletes the Draft. This is distinct from saving a Shift Result as a Manual Override.
      parameters:
        - $ref: '#/components/parameters/ShiftResultDraftId'
      responses:
        '200':
          description: The Shift Result Draft was confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmShiftResultDraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftResultDraftResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftResultDraftConflict'
  /api/v1/calculation/draft/{id}/delete:
    delete:
      tags:
        - Shift Result Draft
      operationId: deleteShiftResultDraft
      summary: Delete a Shift Result Draft
      description: Deletes a Shift Result Draft and returns its Shift Session to the state from before calculation. Deleting an absent Draft is also successful.
      parameters:
        - $ref: '#/components/parameters/ShiftResultDraftId'
      responses:
        '204':
          description: The Shift Result Draft is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ShiftResultDraftConflict'
  /api/v1/shift-result/{resultId}/get/detailed:
    get:
      tags:
        - Shift Result
      operationId: getShiftResult
      summary: Get a Shift Result
      description: Returns one Shift Result with detailed Payments and its Shift Session when the result was created by confirming a Shift Result Draft. A Manual Override has no Shift Session.
      parameters:
        - $ref: '#/components/parameters/ShiftResultId'
      responses:
        '200':
          description: The Shift Result and its optional Shift Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftResultResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftResultConflict'
  /api/v1/shift-result/get/detailed/by-period/page:
    get:
      tags:
        - Shift Result
      operationId: getShiftResultsPage
      summary: List a page of Shift Results for a Payroll Period
      description: Returns detailed Shift Results for a Company and inclusive Payroll Period. `CUSTOM` requires `start` and `end`; `CURRENT` and `PREVIOUS` require `now`. The response guarantees the page content, index, requested size, and total element count; additional Spring pagination fields may be present but are not part of the supported contract.
      parameters:
        - $ref: '#/components/parameters/ShiftResultCompanyId'
        - $ref: '#/components/parameters/PeriodType'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CurrentDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Shift Results in the selected Payroll Period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResultPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyNotFound'
        '409':
          $ref: '#/components/responses/ShiftResultConflict'
  /api/v1/shift-result/save:
    post:
      tags:
        - Shift Result
      operationId: saveManualOverrideShiftResult
      summary: Save a Shift Result as a Manual Override
      description: Saves directly entered Payments as a Manual Override Shift Result. This does not confirm a Shift Result Draft and the saved result has no Shift Session. When `overwrite` is true, an existing result for the same Company and date is replaced; `replacementId` can additionally identify an earlier result to delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveManualOverrideShiftResultRequest'
      responses:
        '201':
          description: The Manual Override Shift Result was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveManualOverrideShiftResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyNotFound'
        '409':
          $ref: '#/components/responses/ShiftResultConflict'
  /api/v1/shift-result/{resultId}/delete:
    delete:
      tags:
        - Shift Result
      operationId: deleteShiftResult
      summary: Delete a Shift Result
      description: Deletes a Shift Result and all its Payments. Deleting an absent result is also successful.
      parameters:
        - $ref: '#/components/parameters/ShiftResultId'
      responses:
        '204':
          description: The Shift Result is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/ShiftResultConflict'
  /api/v1/salary/own/get:
    get:
      tags:
        - Payroll
      operationId: getOwnPayroll
      summary: Get the current Employee's Payroll
      description: Returns Payments for the authenticated User's Employee record in one Company and Payroll Period. The historical `/salary` URL is preserved while the operation and schema use canonical Payroll terminology.
      parameters:
        - $ref: '#/components/parameters/PayrollCompanyId'
        - $ref: '#/components/parameters/PeriodType'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CurrentDate'
      responses:
        '200':
          description: The Employee's Payroll, possibly with no Payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payroll'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PayrollResourceNotFound'
        '409':
          $ref: '#/components/responses/PayrollConflict'
  /api/v1/salary/staff/get:
    get:
      tags:
        - Payroll
      operationId: getStaffPayroll
      summary: Get the staff Payroll
      description: Returns Payments for all Employees represented in one Company's Payroll during the selected Payroll Period. The historical `/salary` URL is preserved while the operation and schema use canonical Payroll terminology.
      parameters:
        - $ref: '#/components/parameters/PayrollCompanyId'
        - $ref: '#/components/parameters/PeriodType'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CurrentDate'
      responses:
        '200':
          description: The Company's staff Payroll, possibly with no Payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payroll'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PayrollResourceNotFound'
        '409':
          $ref: '#/components/responses/PayrollConflict'
  /api/v1/salary/reports-table:
    get:
      tags:
        - Payroll
      operationId: exportStaffPayroll
      summary: Export the staff Payroll reports table
      description: Exports the selected Company's staff Payroll as an XLSX reports table. The current endpoint returns the file with the generic binary media type and an attachment disposition using the stable `reports.xlsx` filename.
      parameters:
        - $ref: '#/components/parameters/PayrollCompanyId'
        - $ref: '#/components/parameters/PeriodType'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/CurrentDate'
      responses:
        '200':
          description: An XLSX file containing the staff Payroll reports table.
          headers:
            Content-Disposition:
              description: Marks the response as an attachment named `reports.xlsx`.
              schema:
                type: string
              example: attachment; filename=reports.xlsx
            Content-Length:
              description: Size of the generated XLSX file in bytes.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PayrollResourceNotFound'
        '409':
          $ref: '#/components/responses/PayrollConflict'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT access token accepted by the Wage App resource server.
  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: The Company's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 9b66d829-8909-4399-bbbe-8ad4b14b9251
    EmployeeId:
      name: id
      in: path
      required: true
      description: The Employee's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    EmployeeBindingId:
      name: employeeId
      in: path
      required: true
      description: The identifier of the Employee to bind to a User.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    CompanyIds:
      name: companyIds
      in: query
      required: true
      description: One or more Company identifiers supplied as repeated `companyIds` parameters. Only Companies with at least one matching Employee are represented in the response.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        nullable: false
        items:
          type: string
          format: uuid
          nullable: false
      example:
        - 9b66d829-8909-4399-bbbe-8ad4b14b9251
    UserId:
      name: userId
      in: query
      required: true
      description: The external identifier of the User to bind. It must not already be bound to a different Employee.
      schema:
        type: string
        nullable: false
      example: keycloak-user-123
    ShiftSessionCompanyId:
      name: companyId
      in: query
      required: true
      description: Identifier of the Company whose Shift Sessions are requested.
      schema:
        type: string
        format: uuid
        nullable: false
    ShiftSessionId:
      name: sessionId
      in: path
      required: true
      description: The Shift Session's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
    CheckpointId:
      name: checkpointId
      in: path
      required: true
      description: The Checkpoint's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
    ShiftResultCompanyId:
      name: companyId
      in: query
      required: true
      description: Identifier of the Company whose Shift Results are requested.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 5b367932-2e5d-4d89-aa07-17f65ff4af9c
    PayrollCompanyId:
      name: companyId
      in: query
      required: true
      description: Identifier of the Company whose Payroll is requested.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 9b66d829-8909-4399-bbbe-8ad4b14b9251
    ShiftResultDraftId:
      name: id
      in: path
      required: true
      description: Identifier of the Shift Result Draft.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 3d65c0d7-69d9-4797-b976-37125a931534
    ShiftResultId:
      name: resultId
      in: path
      required: true
      description: Identifier of the Shift Result.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 981f843f-9e31-4628-a81f-0c98a88af97c
    PeriodType:
      name: periodType
      in: query
      required: true
      description: Selects the requested Payroll Period. `CUSTOM` requires `start` and `end` and ignores `now`. `CURRENT` and `PREVIOUS` require `now` and ignore `start` and `end`. Standard periods cover either days 1 through 15 or day 16 through the last day of a calendar month.
      schema:
        type: string
        nullable: false
        enum:
          - CUSTOM
          - CURRENT
          - PREVIOUS
      example: CUSTOM
    StartDate:
      name: start
      in: query
      required: false
      description: Inclusive first date of a `CUSTOM` Payroll Period. Required only when `periodType` is `CUSTOM`; otherwise ignored. It must not be after `end`.
      schema:
        type: string
        format: date
        nullable: false
      example: '2026-08-01'
    EndDate:
      name: end
      in: query
      required: false
      description: Inclusive last date of a `CUSTOM` Payroll Period. Required only when `periodType` is `CUSTOM`; otherwise ignored. It must not be before `start`.
      schema:
        type: string
        format: date
        nullable: false
      example: '2026-08-15'
    CurrentDate:
      name: now
      in: query
      required: false
      description: Reference date used to construct a `CURRENT` or `PREVIOUS` Payroll Period. Required for those period types; ignored for `CUSTOM`.
      schema:
        type: string
        format: date
        nullable: false
      example: '2026-08-13'
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. Missing, malformed, or negative values currently use the default of 0.
      schema:
        type: integer
        format: int32
        default: 0
        nullable: false
    Size:
      name: size
      in: query
      required: false
      description: Requested number of resources per page. Missing, malformed, or nonpositive values use the default of 100; values above 2000 are capped at 2000.
      schema:
        type: integer
        format: int32
        default: 100
        nullable: false
    Sort:
      name: sort
      in: query
      required: false
      description: Sort criterion in `property,direction` form. Repeat the parameter for multiple criteria. Direction is `asc` or `desc`; when omitted, ascending order is used.
      style: form
      explode: true
      schema:
        type: array
        nullable: false
        items:
          type: string
      example:
        - title,asc
  responses:
    BadRequest:
      description: The path, query parameters, or request body are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: A valid JWT was not supplied. The current response has no body.
    Forbidden:
      description: The authenticated principal is not allowed to perform the operation. The current response has no body.
    CompanyNotFound:
      description: The requested Company does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CompanyConflict:
      description: Another Company already has the requested title.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    EmployeeNotFound:
      description: The requested Employee does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UserBindingConflict:
      description: The requested User is already bound to a different Employee.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftSessionResourceNotFound:
      description: A referenced Company or Shift Session does not exist, or no opened Shift Session exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftSessionConflict:
      description: The authenticated User is not associated with the Company, the Shift Session is not in a state allowed by the operation, or multiple opened sessions exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CheckpointResourceNotFound:
      description: A referenced Checkpoint, Shift Session, or Company does not exist. Deleting an unknown Checkpoint remains successful; deletion returns this response only if an existing Checkpoint refers to a missing Shift Session or Company.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CheckpointConflict:
      description: The authenticated User is not associated with the Company, or the Shift Session state does not allow its Checkpoints to be modified.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftResultDraftResourceNotFound:
      description: A referenced Shift Result Draft or Shift Session does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftResultResourceNotFound:
      description: A referenced Shift Result or Company does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftResultDraftConflict:
      description: The Shift Session state does not allow the operation, or the authenticated User is not associated with the Shift Session's Company.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftResultConflict:
      description: The operation conflicts with an existing Shift Result, duplicate Payment employees, or the authenticated User's Company associations.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PayrollResourceNotFound:
      description: The requested Company or authenticated User's Employee record does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PayrollConflict:
      description: The authenticated User is not associated with the requested Company.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Company:
      type: object
      description: A work location whose Shift Sessions and Payroll are accounted independently.
      additionalProperties: false
      required:
        - id
        - title
        - employeeWageCoefficientFromRevenue
        - defaultShiftStartTime
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Company's identifier.
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: false
          description: The unique display title of the Company.
          example: Central Cafe
        employeeWageCoefficientFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: The Company's Revenue Percentage expressed as a whole-number percentage.
          example: 15
        defaultShiftStartTime:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
          nullable: false
          description: Default local Shift Session Start time in 24-hour `HH:mm` form.
          example: '09:00'
    CompanyCreateOrUpdateRequest:
      type: object
      description: Fields required to create or update a Company.
      additionalProperties: false
      required:
        - title
        - employeeWageCoefficientFromRevenue
        - defaultShiftStartTime
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: false
          description: The unique display title of the Company.
          example: Central Cafe
        employeeWageCoefficientFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: The Company's Revenue Percentage expressed as a whole-number percentage.
          example: 15
        defaultShiftStartTime:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
          nullable: false
          description: Default local Shift Session Start time in 24-hour `HH:mm` form.
          example: '09:00'
    UserCompaniesResponse:
      type: object
      description: Companies associated with the authenticated User's Employee record.
      additionalProperties: false
      required:
        - companies
      properties:
        companies:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/Company'
    CompanyPage:
      type: object
      description: Stable Company pagination fields. The server can emit additional framework metadata, which consumers must not rely on.
      additionalProperties: true
      required:
        - content
        - number
        - size
        - totalElements
      properties:
        content:
          type: array
          nullable: false
          description: Companies in this page.
          items:
            $ref: '#/components/schemas/Company'
        number:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          description: Zero-based page index.
          example: 0
        size:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          description: Requested page size, or zero for an unpaged response.
          example: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
          nullable: false
          description: Total number of Companies across all pages.
          example: 2
    Position:
      type: string
      description: The Employee's operational designation; it does not grant system permissions.
      nullable: false
      enum:
        - MANAGER
        - WAITER_ACTIVE
        - WAITER_INACTIVE
      example: WAITER_ACTIVE
    Employee:
      type: object
      description: A person whose work and pay are accounted by Companies. The current API also permits an Employee to exist without a Company membership.
      additionalProperties: false
      required:
        - id
        - companyIds
        - userId
        - firstName
        - lastName
        - patronymic
        - simpleName
        - position
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
          example: 6a3c626f-0d0f-41d8-9818-06d263b25695
        companyIds:
          type: array
          nullable: false
          description: Identifiers of the Companies whose membership includes this Employee.
          items:
            type: string
            format: uuid
            nullable: false
          example:
            - 9b66d829-8909-4399-bbbe-8ad4b14b9251
        userId:
          type: string
          nullable: true
          description: The bound User's external identifier, or null when no User is bound.
          example: keycloak-user-123
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
          example: Ivan
        lastName:
          type: string
          nullable: false
          description: The Employee's family name.
          example: Ivanov
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    CompanyEmployee:
      type: object
      description: Employee details returned within one Company grouping.
      additionalProperties: false
      required:
        - id
        - userId
        - firstName
        - lastName
        - patronymic
        - simpleName
        - position
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
          example: 6a3c626f-0d0f-41d8-9818-06d263b25695
        userId:
          type: string
          nullable: true
          description: The bound User's external identifier, or null when no User is bound.
          example: keycloak-user-123
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
          example: Ivan
        lastName:
          type: string
          nullable: false
          description: The Employee's family name.
          example: Ivanov
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    CompanyEmployees:
      type: object
      description: Employees whose membership includes one Company.
      additionalProperties: false
      required:
        - companyId
        - data
      properties:
        companyId:
          type: string
          format: uuid
          nullable: false
          description: The Company's identifier.
          example: 9b66d829-8909-4399-bbbe-8ad4b14b9251
        data:
          type: array
          nullable: false
          minItems: 1
          description: Employees belonging to this Company.
          items:
            $ref: '#/components/schemas/CompanyEmployee'
    CreateEmployeeRequest:
      type: object
      description: Fields used to create an Employee and establish initial Company memberships.
      additionalProperties: false
      required:
        - firstName
        - lastName
        - patronymic
        - position
      properties:
        companyIds:
          type: array
          nullable: false
          default: []
          description: Identifiers of the Companies the new Employee belongs to. Omission creates the Employee without Company membership.
          items:
            type: string
            format: uuid
            nullable: false
          example:
            - 9b66d829-8909-4399-bbbe-8ad4b14b9251
        firstName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's first name; it must contain a non-whitespace character.
          example: Ivan
        lastName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's family name; it must contain a non-whitespace character.
          example: Ivanov
        patronymic:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's patronymic; it must contain a non-whitespace character.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    UpdateEmployeeRequest:
      type: object
      description: Fields used to replace an Employee's editable details and complete Company membership list. A null or omitted `userId` removes any existing User binding.
      additionalProperties: false
      required:
        - firstName
        - lastName
        - patronymic
        - position
      properties:
        companyIds:
          type: array
          nullable: false
          default: []
          description: Complete replacement list of Company memberships. Omission removes all Company memberships.
          items:
            type: string
            format: uuid
            nullable: false
          example:
            - 9b66d829-8909-4399-bbbe-8ad4b14b9251
        userId:
          type: string
          nullable: true
          description: External identifier of the User to bind, or null/omitted to remove the current binding. A non-null value must be unique across Employees.
          example: keycloak-user-123
        firstName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's first name; it must contain a non-whitespace character.
          example: Ivan
        lastName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's family name; it must contain a non-whitespace character.
          example: Ivanov
        patronymic:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's patronymic; it must contain a non-whitespace character.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    ProblemDetail:
      type: object
      description: RFC 7807 problem details returned for application-level errors.
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
          nullable: false
          description: Identifier for the problem type; currently `about:blank`.
          example: about:blank
        title:
          type: string
          nullable: false
          description: Short HTTP status phrase.
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          nullable: false
          description: HTTP status code.
          example: 404
        detail:
          type: string
          nullable: false
          description: Human-readable explanation specific to this occurrence.
          example: Company 5b367932-2e5d-4d89-aa07-17f65ff4af9c not found
        instance:
          type: string
          format: uri-reference
          nullable: false
          description: Request path associated with this occurrence when supplied by the server.
          example: /api/v1/company/get/5b367932-2e5d-4d89-aa07-17f65ff4af9c
    ShiftSession:
      type: object
      description: One Company's work accounting session. Its `date` and `startWorkTime` together represent the Shift Session Start; that start is not a Checkpoint. Checkpoints are returned in ascending `dateTime` order.
      additionalProperties: false
      required:
        - id
        - companyId
        - startWorkTime
        - date
        - status
        - checkpoints
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Shift Session's identifier.
        companyId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Company whose work is accounted.
        startWorkTime:
          type: string
          format: time
          nullable: false
          description: Local time portion of the Shift Session Start.
          example: '09:00:00'
        date:
          type: string
          format: date
          nullable: false
          description: Local date portion of the Shift Session Start.
          example: '2026-08-13'
        status:
          $ref: '#/components/schemas/ShiftSessionStatus'
        checkpoints:
          type: array
          nullable: false
          description: Checkpoints ordered by their local date and time, possibly empty.
          items:
            $ref: '#/components/schemas/Checkpoint'
    ShiftSessionStatus:
      type: string
      nullable: false
      description: Current lifecycle state. `OPENED` and `RECALCULATING` allow Checkpoint and Shift Session Start changes. Their `_DRAFT` forms indicate that a Shift Result Draft exists. `CLOSED` is eligible to be reopened for Recalculation.
      enum:
        - OPENED
        - CLOSED
        - RECALCULATING
        - OPENED_DRAFT
        - RECALCULATING_DRAFT
    LocalDateTime:
      type: string
      format: local-date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]{1,9})?)?$
      nullable: false
      description: A local date and time serialized without a UTC offset.
      example: '2026-08-13T09:00:00'
    ShiftSessionStart:
      description: The initial local date and time boundary of a Shift Session. It starts the first Shift Interval but is not a Checkpoint. The current API serializes this value without a UTC offset.
      allOf:
        - $ref: '#/components/schemas/LocalDateTime'
    OpenShiftSessionRequest:
      type: object
      description: Values required to open a new Shift Session for a Company.
      additionalProperties: false
      required:
        - companyId
        - startWorkAt
      properties:
        companyId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Company for the new Shift Session.
        startWorkAt:
          $ref: '#/components/schemas/ShiftSessionStart'
    OpenShiftSessionRecalculationRequest:
      type: object
      description: Selects the closed Shift Session to reopen for Recalculation.
      additionalProperties: false
      required:
        - closedSessionId
      properties:
        closedSessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of a Shift Session whose current status is `CLOSED`.
    UpdateShiftSessionStartRequest:
      type: object
      description: Updates the local time portion of an existing Shift Session Start.
      additionalProperties: false
      required:
        - sessionId
        - startWorkTime
      properties:
        sessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Session to update.
        startWorkTime:
          type: string
          format: time
          nullable: false
          description: Replacement local start time; the Shift Session date is unchanged.
          example: '10:30:00'
    Checkpoint:
      description: A boundary that ends a Shift Interval and records the team together with the Company's accumulated Revenue and Restaurant Tips at that time. A Checkpoint's team accounts for the Shift Interval that the Checkpoint ends.
      oneOf:
        - $ref: '#/components/schemas/RegularCheckpoint'
        - $ref: '#/components/schemas/FinalCheckpoint'
      discriminator:
        propertyName: type
        mapping:
          REGULAR: '#/components/schemas/RegularCheckpoint'
          FINAL: '#/components/schemas/FinalCheckpoint'
    CheckpointFields:
      type: object
      description: Fields shared by Regular and Final Checkpoints.
      additionalProperties: false
      required:
        - id
        - tips
        - revenue
        - employees
        - dateTime
        - type
        - metricRecords
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Checkpoint's identifier.
        tips:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Restaurant Tips in whole Russian rubles.
          example: 1200
        revenue:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Revenue in whole Russian rubles.
          example: 18000
        employees:
          type: array
          nullable: false
          description: The Employee team credited with the Shift Interval ending here.
          items:
            $ref: '#/components/schemas/CheckpointEmployee'
        dateTime:
          description: Local date and time of the boundary. The current API serializes this value without a UTC offset.
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
        type:
          $ref: '#/components/schemas/CheckpointType'
        metricRecords:
          type: array
          nullable: false
          description: Additional amounts assigned to Revenue or Restaurant Tips.
          items:
            $ref: '#/components/schemas/CheckpointMetricRecord'
    RegularCheckpoint:
      description: A Regular Checkpoint is followed by another Shift Interval in the same Shift Session.
      allOf:
        - $ref: '#/components/schemas/CheckpointFields'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              nullable: false
              enum:
                - REGULAR
    FinalCheckpoint:
      description: A Final Checkpoint is the last Checkpoint in a Shift Session. It has the same serialized shape and allocation rules as a Regular Checkpoint.
      allOf:
        - $ref: '#/components/schemas/CheckpointFields'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              nullable: false
              enum:
                - FINAL
    CheckpointType:
      type: string
      nullable: false
      description: Whether this is a Regular Checkpoint or the Final Checkpoint.
      enum:
        - REGULAR
        - FINAL
    CheckpointEmployee:
      type: object
      description: An Employee in the team recorded at a Checkpoint.
      additionalProperties: false
      required:
        - id
        - userId
        - firstName
        - lastName
        - patronymic
        - simpleName
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
        userId:
          type: string
          nullable: true
          description: Linked authenticated User identifier, or null when none is linked.
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
        lastName:
          type: string
          nullable: false
          description: The Employee's last name.
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
        simpleName:
          type: string
          nullable: true
          description: Optional short display name.
    CheckpointMetricRecord:
      type: object
      description: An additional recorded amount included in Checkpoint calculation inputs.
      additionalProperties: false
      required:
        - id
        - label
        - destination
        - value
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The metric record's identifier.
        label:
          type: string
          nullable: false
          description: Display label supplied for the recorded amount.
        destination:
          $ref: '#/components/schemas/CheckpointMetricDestination'
        value:
          type: integer
          format: int32
          nullable: false
          description: Amount in whole Russian rubles.
    CheckpointMetricRecordRequest:
      type: object
      description: An additional amount to store with a Checkpoint.
      additionalProperties: false
      required:
        - label
        - destination
        - value
      properties:
        label:
          type: string
          nullable: false
          description: Display label for the recorded amount.
        destination:
          $ref: '#/components/schemas/CheckpointMetricDestination'
        value:
          type: integer
          format: int32
          nullable: false
          description: Amount in whole Russian rubles.
    CheckpointMetricDestination:
      type: string
      nullable: false
      description: Accumulated total to which a Checkpoint metric record belongs.
      enum:
        - REVENUE
        - TIPS
    CreateCheckpointRequest:
      type: object
      description: Complete serialized payload for creating a Checkpoint. The supplied team and accumulated totals describe the Shift Interval that this boundary ends.
      additionalProperties: false
      required:
        - sessionId
        - revenue
        - tips
        - employeeIds
        - dateTime
        - type
        - fieldRecords
      properties:
        sessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Session receiving the Checkpoint.
        revenue:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Revenue in whole Russian rubles.
        tips:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Restaurant Tips in whole Russian rubles.
        employeeIds:
          type: array
          uniqueItems: true
          nullable: false
          description: Identifiers of the Employee team for the ended Shift Interval.
          items:
            type: string
            format: uuid
            nullable: false
        dateTime:
          description: Local Checkpoint date and time without a UTC offset in the current API.
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
        type:
          $ref: '#/components/schemas/CheckpointType'
        fieldRecords:
          type: array
          nullable: false
          description: Additional amounts assigned to Revenue or Restaurant Tips.
          items:
            $ref: '#/components/schemas/CheckpointMetricRecordRequest'
    UpdateCheckpointRequest:
      type: object
      description: Complete replacement payload for a Checkpoint, including its team, accumulated Revenue, accumulated Restaurant Tips, type, time, and metric records.
      additionalProperties: false
      required:
        - id
        - revenue
        - tips
        - employeeIds
        - dateTime
        - type
        - fieldRecords
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Checkpoint to replace.
        revenue:
          type: integer
          format: int32
          nullable: false
          description: Replacement accumulated Revenue in whole Russian rubles.
        tips:
          type: integer
          format: int32
          nullable: false
          description: Replacement accumulated Restaurant Tips in whole Russian rubles.
        employeeIds:
          type: array
          uniqueItems: true
          nullable: false
          description: Replacement Employee team for the ended Shift Interval.
          items:
            type: string
            format: uuid
            nullable: false
        dateTime:
          description: Replacement local Checkpoint date and time without a UTC offset in the current API.
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
        type:
          $ref: '#/components/schemas/CheckpointType'
        fieldRecords:
          type: array
          nullable: false
          description: Replacement additional Revenue and Restaurant Tips amounts.
          items:
            $ref: '#/components/schemas/CheckpointMetricRecordRequest'
    ShiftResultDraft:
      type: object
      description: A provisional calculation of employee Payments that has not yet been confirmed.
      additionalProperties: false
      required:
        - id
        - payments
        - date
        - sessionId
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Result Draft.
          example: 3d65c0d7-69d9-4797-b976-37125a931534
        payments:
          type: array
          nullable: false
          description: Provisional Payments calculated for the Shift Session team.
          items:
            $ref: '#/components/schemas/ShiftResultDraftPayment'
        date:
          type: string
          format: date
          nullable: false
          description: Local business date of the Shift Session.
          example: '2026-08-13'
        sessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Session being calculated.
          example: a840e78e-856c-4d79-bf36-8963a04a1dcf
    ShiftResultDraftPayment:
      type: object
      description: A provisional employee Payment calculated for a Shift Result Draft.
      additionalProperties: false
      required:
        - id
        - employee
        - percentFromRevenue
        - tips
        - workSeconds
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the provisional Payment.
          example: eb412773-eaf0-430f-8f60-9dbb7db89685
        employee:
          allOf:
            - $ref: '#/components/schemas/ShiftResultDraftEmployee'
          nullable: false
          description: Employee receiving the provisional Payment.
        percentFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: Percent from Revenue allocated to the Employee, in whole Russian rubles.
          example: 2400
        tips:
          type: integer
          format: int32
          nullable: false
          description: Employee Tips allocated to the Employee, in whole Russian rubles.
          example: 900
        workSeconds:
          type: integer
          format: int64
          nullable: false
          description: Employee work duration represented as whole seconds.
          example: 28800
    ShiftResultDraftEmployee:
      type: object
      description: Employee identity displayed in a Shift Result Draft Payment.
      additionalProperties: false
      required:
        - id
        - firstName
        - lastName
        - patronymic
        - simpleName
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Employee.
          example: 68e13904-36df-4295-bfe8-d16e96652dc6
        firstName:
          type: string
          nullable: false
          description: Employee's first name.
          example: Anna
        lastName:
          type: string
          nullable: false
          description: Employee's last name.
          example: Petrova
        patronymic:
          type: string
          nullable: false
          description: Employee's patronymic.
          example: Sergeevna
        simpleName:
          type: string
          nullable: true
          description: Optional short display name. The field is present and can be null.
          example: Anya
    ConfirmShiftResultDraftResponse:
      type: object
      description: Identifies the Shift Result created by confirming a Shift Result Draft.
      additionalProperties: false
      required:
        - resultId
      properties:
        resultId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the created Shift Result.
          example: 981f843f-9e31-4628-a81f-0c98a88af97c
    ShiftResult:
      type: object
      description: The confirmed set of employee Payments for one Company's Shift Session or Manual Override.
      additionalProperties: false
      required:
        - id
        - payments
        - date
        - sessionId
        - calculationSource
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Result.
          example: 981f843f-9e31-4628-a81f-0c98a88af97c
        payments:
          type: array
          nullable: false
          description: Confirmed Payments in this Shift Result.
          items:
            $ref: '#/components/schemas/Payment'
        date:
          type: string
          format: date
          nullable: false
          description: Local business date covered by the Shift Result.
          example: '2026-08-13'
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: Identifier of the Shift Session whose Draft was confirmed. It is null for a Shift Result saved as a Manual Override.
          example: a840e78e-856c-4d79-bf36-8963a04a1dcf
        calculationSource:
          allOf:
            - $ref: '#/components/schemas/CalculationSource'
          nullable: false
          description: Whether Payments came from confirmed Checkpoints or a Manual Override.
    Payment:
      type: object
      description: An Employee's confirmed Percent from Revenue and Employee Tips in a Shift Result.
      additionalProperties: false
      required:
        - id
        - employee
        - percentFromRevenue
        - tips
        - workSeconds
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Payment.
          example: 266b450d-d474-4440-a7e5-abd6ce155984
        employee:
          allOf:
            - $ref: '#/components/schemas/PaymentEmployee'
          nullable: false
          description: Employee receiving the Payment.
        percentFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: Percent from Revenue allocated to the Employee, in whole Russian rubles.
          example: 2400
        tips:
          type: integer
          format: int32
          nullable: false
          description: Employee Tips allocated to the Employee, in whole Russian rubles.
          example: 900
        workSeconds:
          type: integer
          format: int64
          nullable: false
          description: Employee work duration represented as whole seconds.
          example: 28800
    PaymentEmployee:
      type: object
      description: Employee identity displayed in a confirmed Payment.
      additionalProperties: false
      required:
        - id
        - firstName
        - lastName
        - patronymic
        - simpleName
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Employee.
          example: 68e13904-36df-4295-bfe8-d16e96652dc6
        firstName:
          type: string
          nullable: false
          description: Employee's first name.
          example: Anna
        lastName:
          type: string
          nullable: false
          description: Employee's last name.
          example: Petrova
        patronymic:
          type: string
          nullable: false
          description: Employee's patronymic.
          example: Sergeevna
        simpleName:
          type: string
          nullable: true
          description: Optional short display name. The field is present and can be null.
          example: Anya
    CalculationSource:
      type: string
      nullable: false
      description: Source used to establish the Shift Result Payments.
      enum:
        - CHECKPOINTS
        - MANUAL_OVERRIDE
      example: CHECKPOINTS
    SaveManualOverrideShiftResultRequest:
      type: object
      description: Directly entered Payments used to save a Shift Result as a Manual Override. The calculation source is always `MANUAL_OVERRIDE` and is not accepted as input.
      additionalProperties: false
      required:
        - companyId
        - payments
        - date
      properties:
        replacementId:
          type: string
          format: uuid
          nullable: true
          description: Optional identifier of an earlier Shift Result to delete before saving.
          example: 19ea2df0-caa1-40a0-9e2b-dd013131b3cd
        companyId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Company that owns the Shift Result.
          example: 5b367932-2e5d-4d89-aa07-17f65ff4af9c
        overwrite:
          type: boolean
          default: false
          nullable: false
          description: Whether to replace an existing Shift Result for the same Company and date.
          example: true
        payments:
          type: array
          nullable: false
          description: Directly entered Payments. Each Employee identifier must occur at most once.
          items:
            $ref: '#/components/schemas/ManualOverridePaymentRequest'
        date:
          type: string
          format: date
          nullable: false
          description: Local business date covered by the Manual Override.
          example: '2026-08-13'
    ManualOverridePaymentRequest:
      type: object
      description: Directly entered Payment used in a Manual Override Shift Result.
      additionalProperties: false
      required:
        - employeeId
        - percentFromRevenue
        - tips
        - workSeconds
      properties:
        employeeId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Employee receiving the Payment.
          example: 68e13904-36df-4295-bfe8-d16e96652dc6
        percentFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: Directly entered Percent from Revenue, in whole Russian rubles.
          example: 2400
        tips:
          type: integer
          format: int32
          nullable: false
          description: Directly entered Employee Tips, in whole Russian rubles.
          example: 900
        workSeconds:
          type: integer
          format: int64
          nullable: false
          description: Directly entered Employee work duration represented as whole seconds.
          example: 28800
    SaveManualOverrideShiftResultResponse:
      type: object
      description: Identifies the Shift Result saved as a Manual Override.
      additionalProperties: false
      required:
        - resultId
      properties:
        resultId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the saved Shift Result.
          example: 981f843f-9e31-4628-a81f-0c98a88af97c
    ShiftResultResponse:
      type: object
      description: A detailed Shift Result and the Shift Session from which it was calculated, when applicable.
      additionalProperties: false
      required:
        - shiftResult
        - session
      properties:
        shiftResult:
          allOf:
            - $ref: '#/components/schemas/ShiftResult'
          nullable: false
          description: Confirmed Shift Result with detailed Payments.
        session:
          allOf:
            - $ref: '#/components/schemas/ShiftSession'
          nullable: true
          description: Shift Session associated with a checkpoint-calculated Shift Result. The field is present and null for a Manual Override.
    ShiftResultPage:
      type: object
      description: Stable Shift Result pagination fields. The server can emit additional framework metadata, which consumers must not rely on.
      additionalProperties: true
      required:
        - content
        - number
        - size
        - totalElements
      properties:
        content:
          type: array
          nullable: false
          description: Shift Results in this page.
          items:
            $ref: '#/components/schemas/ShiftResult'
        number:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          description: Zero-based page index.
          example: 0
        size:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          description: Requested page size, or zero for an unpaged response.
          example: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
          nullable: false
          description: Total number of Shift Results across all pages.
          example: 2
    Payroll:
      type: object
      description: Employee Payments aggregated over one Payroll Period for a Company. Elements are ordered by date; the aggregation granularity depends on the amount of source data in the selected period.
      additionalProperties: false
      required:
        - type
        - elements
        - summaries
      properties:
        type:
          $ref: '#/components/schemas/PayrollAggregation'
        elements:
          type: array
          nullable: false
          description: Date-ordered Payment groups at the selected aggregation granularity.
          items:
            $ref: '#/components/schemas/PayrollElement'
        summaries:
          type: array
          nullable: false
          description: Payroll totals grouped by Employee over the complete selected period.
          items:
            $ref: '#/components/schemas/EmployeePayrollSummary'
    PayrollAggregation:
      type: string
      nullable: false
      description: Granularity of the Payroll elements. Daily data is returned for up to 31 source elements, monthly data for more than 31 and up to three years of source elements, and yearly data beyond that threshold.
      enum:
        - BY_DAY
        - BY_MONTH
        - BY_YEAR
      example: BY_DAY
    PayrollElement:
      type: object
      description: Payments aggregated for one day, month, or year in a Payroll.
      additionalProperties: false
      required:
        - date
        - payments
      properties:
        date:
          type: string
          format: date
          nullable: false
          description: The source day for daily aggregation, the first day of the month for monthly aggregation, or the first day of the year for yearly aggregation.
          example: '2026-01-01'
        payments:
          type: array
          nullable: false
          description: Payments for Employees represented in this element.
          items:
            $ref: '#/components/schemas/PayrollPayment'
    PayrollPayment:
      type: object
      description: One Employee's Percent from Revenue and Employee Tips within a Payroll element. Monetary amounts are whole Russian rubles.
      additionalProperties: false
      required:
        - employee
        - percentFromRevenue
        - tips
      properties:
        employee:
          allOf:
            - $ref: '#/components/schemas/PayrollEmployee'
          nullable: false
          description: Employee receiving the Payment.
        percentFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: The Employee's Percent from Revenue in whole Russian rubles.
          example: 2500
        tips:
          type: integer
          format: int32
          nullable: false
          description: The Employee Tips allocated to the Employee in whole Russian rubles.
          example: 1200
    EmployeePayrollSummary:
      type: object
      description: One Employee's Payment totals over the complete Payroll Period.
      additionalProperties: false
      required:
        - employee
        - totalPercentFromRevenue
        - totalTips
      properties:
        employee:
          allOf:
            - $ref: '#/components/schemas/PayrollEmployee'
          nullable: false
          description: Employee whose Payments are totaled.
        totalPercentFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: Total Percent from Revenue in whole Russian rubles.
          example: 25000
        totalTips:
          type: integer
          format: int32
          nullable: false
          description: Total Employee Tips in whole Russian rubles.
          example: 12000
    PayrollEmployee:
      type: object
      description: Employee identity embedded in a Payroll Payment or summary.
      additionalProperties: false
      required:
        - id
        - firstName
        - lastName
        - patronymic
        - simpleName
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
          example: 6a3c626f-0d0f-41d8-9818-06d263b25695
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
          example: Ivan
        lastName:
          type: string
          nullable: false
          description: The Employee's family name.
          example: Ivanov
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
