openapi: 3.0.3
info:
  title: Wage App API
  version: 0.1.0
  description: Draft baseline for the authenticated Company, Employee, Shift Session, and Checkpoint operations currently provided by Wage App. This contract is not yet the complete /api/v1 contract.
servers:
  - url: /
    description: Current Wage App server
security:
  - BearerAuth: []
tags:
  - name: Company
    description: Operations for a work location whose shifts and pay are accounted independently.
  - name: Employee
    description: Operations for people whose work and pay are accounted by Companies.
  - name: Shift Session
    description: Operations for a Company's team-based work accounting session.
  - name: Checkpoint
    description: Operations for boundaries that end Shift Intervals and record their teams and totals.
paths:
  /api/v1/company/get/{id}:
    get:
      tags:
        - Company
      operationId: getCompany
      summary: Get a Company
      description: Returns one Company by its identifier.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: The Company was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyNotFound'
  /api/v1/company/get/for-user:
    get:
      tags:
        - Company
      operationId: getCompaniesForUser
      summary: List the current user's Companies
      description: Returns the Companies associated with the authenticated User's Employee record.
      responses:
        '200':
          description: The Companies associated with the current User, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompaniesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/company/get/page:
    get:
      tags:
        - Company
      operationId: getCompaniesPage
      summary: List a page of Companies
      description: Returns a page of Companies. The response guarantees the page content, index, requested size, and total element count; additional Spring pagination fields may be present but are not part of the supported contract.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Companies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/company/create:
    post:
      tags:
        - Company
      operationId: createCompany
      summary: Create a Company
      description: Creates a Company with a unique title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateOrUpdateRequest'
      responses:
        '201':
          description: The Company was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CompanyConflict'
  /api/v1/company/update/{id}:
    put:
      tags:
        - Company
      operationId: updateCompany
      summary: Update a Company
      description: Replaces the editable fields of an existing Company.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateOrUpdateRequest'
      responses:
        '204':
          description: The Company was updated successfully. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyNotFound'
        '409':
          $ref: '#/components/responses/CompanyConflict'
  /api/v1/company/delete/{id}:
    delete:
      tags:
        - Company
      operationId: deleteCompany
      summary: Delete a Company
      description: Deletes a Company by identifier. Deleting an absent Company is also successful.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '204':
          description: The Company is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/get/{id}:
    get:
      tags:
        - Employee
      operationId: getEmployee
      summary: Get an Employee
      description: Returns one Employee, including all Company memberships and any User binding.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: The Employee was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
  /api/v1/employee/get/all:
    get:
      tags:
        - Employee
      operationId: getAllEmployees
      summary: List all Employees
      description: Returns every Employee, including Company memberships and User bindings.
      responses:
        '200':
          description: All Employees, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/get/by-companies:
    get:
      tags:
        - Employee
      operationId: getEmployeesByCompanies
      summary: List Employees by Company
      description: Returns Employees grouped by each requested Company. A Company without a matching Employee is omitted rather than returned with an empty collection.
      parameters:
        - $ref: '#/components/parameters/CompanyIds'
      responses:
        '200':
          description: Company groups that contain at least one matching Employee, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/CompanyEmployees'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/get/coworkers:
    get:
      tags:
        - Employee
      operationId: getCoworkers
      summary: List the current User's coworkers
      description: Returns Employees, including the current User's Employee, grouped by each Company shared with the current User. Returns an empty list when the User is not bound to an Employee or that Employee has no Company membership.
      responses:
        '200':
          description: Company groups containing the current User's coworkers, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/CompanyEmployees'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/create:
    post:
      tags:
        - Employee
      operationId: createEmployee
      summary: Create an Employee
      description: Creates an Employee and establishes the requested Company memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: The Employee was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/employee/update/{id}:
    put:
      tags:
        - Employee
      operationId: updateEmployee
      summary: Update an Employee
      description: Replaces the Employee's editable details and full Company membership list. The request can also replace or remove the User binding.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '204':
          description: The Employee was updated successfully. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '409':
          $ref: '#/components/responses/UserBindingConflict'
  /api/v1/employee/bind-user/{employeeId}:
    put:
      tags:
        - Employee
      operationId: bindEmployeeUser
      summary: Bind an Employee to a User
      description: Replaces the Employee's User binding with the supplied external User identifier. Company memberships and Employee details are unchanged.
      parameters:
        - $ref: '#/components/parameters/EmployeeBindingId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: The User was bound to the Employee. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EmployeeNotFound'
        '409':
          $ref: '#/components/responses/UserBindingConflict'
  /api/v1/employee/delete/{id}:
    delete:
      tags:
        - Employee
      operationId: deleteEmployee
      summary: Delete an Employee
      description: Deletes an Employee and its Company memberships by identifier. Deleting an absent Employee is also successful.
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '204':
          description: The Employee is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/session/get/opened:
    get:
      tags:
        - Shift Session
      operationId: getOpenedShiftSession
      summary: Get a Company's opened Shift Session
      description: Returns the Company's single Shift Session in `OPENED` or `OPENED_DRAFT` state. Multiple matching sessions are treated as a conflict rather than an arbitrary session being selected.
      parameters:
        - $ref: '#/components/parameters/ShiftSessionCompanyId'
      responses:
        '200':
          description: The Company's opened Shift Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/get/available/{sessionId}:
    get:
      tags:
        - Shift Session
      operationId: getAvailableShiftSession
      summary: Get an available Shift Session
      description: 'Returns a Shift Session only when it is available to the current workflow: `OPENED`, `OPENED_DRAFT`, `RECALCULATING`, or `RECALCULATING_DRAFT`.'
      parameters:
        - $ref: '#/components/parameters/ShiftSessionId'
      responses:
        '200':
          description: The available Shift Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/get/available/all:
    get:
      tags:
        - Shift Session
      operationId: getAvailableShiftSessions
      summary: List a Company's available Shift Sessions
      description: Returns every Shift Session in `OPENED`, `OPENED_DRAFT`, `RECALCULATING`, or `RECALCULATING_DRAFT` state. The collection is empty when none exist.
      parameters:
        - $ref: '#/components/parameters/ShiftSessionCompanyId'
      responses:
        '200':
          description: Available Shift Sessions, possibly empty.
          content:
            application/json:
              schema:
                type: array
                nullable: false
                items:
                  $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/open:
    post:
      tags:
        - Shift Session
      operationId: openShiftSession
      summary: Open a new Shift Session
      description: Opens a Shift Session at the supplied local Shift Session Start. A Company cannot have another session in `OPENED` state. The start is the first time boundary and is not represented as a Checkpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftSessionRequest'
      responses:
        '201':
          description: The Shift Session was opened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/recalculating:
    post:
      tags:
        - Shift Session
      operationId: openShiftSessionRecalculation
      summary: Reopen a Shift Session for Recalculation
      description: Changes a `CLOSED` Shift Session to `RECALCULATING` so its Checkpoints can be changed and its Shift Result calculated again. This reopens the existing Shift Session; it does not create a second session or copy its Checkpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftSessionRecalculationRequest'
      responses:
        '201':
          description: The existing Shift Session was reopened for Recalculation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/{sessionId}/close:
    put:
      tags:
        - Shift Session
      operationId: closeShiftSession
      summary: Close a Shift Session
      description: 'Sets the Shift Session state to `CLOSED`. The current operation is idempotent with respect to session state: already closed and recalculating sessions are also left closed successfully.'
      parameters:
        - $ref: '#/components/parameters/ShiftSessionId'
      responses:
        '204':
          description: The Shift Session is closed. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/session/update/time:
    put:
      tags:
        - Shift Session
      operationId: updateShiftSessionStart
      summary: Update a Shift Session Start time
      description: Replaces only the local time portion of the Shift Session Start; the session date is unchanged. The current state must be `OPENED` or `RECALCULATING`, so the update is rejected while a Shift Result Draft exists or after closure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftSessionStartRequest'
      responses:
        '204':
          description: The Shift Session Start time was updated. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShiftSessionResourceNotFound'
        '409':
          $ref: '#/components/responses/ShiftSessionConflict'
  /api/v1/checkpoint/create:
    post:
      tags:
        - Checkpoint
      operationId: createCheckpoint
      summary: Create a Checkpoint
      description: Creates a boundary in an `OPENED` or `RECALCULATING` Shift Session. The Checkpoint records the Employee team, accumulated Revenue, and accumulated Restaurant Tips for the Shift Interval that it ends. `FINAL` uses the same payload and allocation rules as `REGULAR`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckpointRequest'
      responses:
        '201':
          description: The Checkpoint was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CheckpointResourceNotFound'
        '409':
          $ref: '#/components/responses/CheckpointConflict'
  /api/v1/checkpoint/update:
    post:
      tags:
        - Checkpoint
      operationId: updateCheckpoint
      summary: Update a Checkpoint
      description: Replaces a Checkpoint's boundary time, type, complete Employee team, accumulated Revenue, accumulated Restaurant Tips, and metric records. Its owning Shift Session must be in `OPENED` or `RECALCULATING` state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckpointRequest'
      responses:
        '200':
          description: The updated Checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CheckpointResourceNotFound'
        '409':
          $ref: '#/components/responses/CheckpointConflict'
  /api/v1/checkpoint/{checkpointId}/delete:
    delete:
      tags:
        - Checkpoint
      operationId: deleteCheckpoint
      summary: Delete a Checkpoint
      description: Deletes a Checkpoint only while its Shift Session is `OPENED` or `RECALCULATING`. Deleting an absent Checkpoint is also successful.
      parameters:
        - $ref: '#/components/parameters/CheckpointId'
      responses:
        '204':
          description: The Checkpoint is absent after the request. The response has no body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CheckpointResourceNotFound'
        '409':
          $ref: '#/components/responses/CheckpointConflict'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT access token accepted by the Wage App resource server.
  parameters:
    CompanyId:
      name: id
      in: path
      required: true
      description: The Company's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 9b66d829-8909-4399-bbbe-8ad4b14b9251
    EmployeeId:
      name: id
      in: path
      required: true
      description: The Employee's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    EmployeeBindingId:
      name: employeeId
      in: path
      required: true
      description: The identifier of the Employee to bind to a User.
      schema:
        type: string
        format: uuid
        nullable: false
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    CompanyIds:
      name: companyIds
      in: query
      required: true
      description: One or more Company identifiers supplied as repeated `companyIds` parameters. Only Companies with at least one matching Employee are represented in the response.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        nullable: false
        items:
          type: string
          format: uuid
          nullable: false
      example:
        - 9b66d829-8909-4399-bbbe-8ad4b14b9251
    UserId:
      name: userId
      in: query
      required: true
      description: The external identifier of the User to bind. It must not already be bound to a different Employee.
      schema:
        type: string
        nullable: false
      example: keycloak-user-123
    ShiftSessionCompanyId:
      name: companyId
      in: query
      required: true
      description: Identifier of the Company whose Shift Sessions are requested.
      schema:
        type: string
        format: uuid
        nullable: false
    ShiftSessionId:
      name: sessionId
      in: path
      required: true
      description: The Shift Session's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
    CheckpointId:
      name: checkpointId
      in: path
      required: true
      description: The Checkpoint's identifier.
      schema:
        type: string
        format: uuid
        nullable: false
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. Missing, malformed, or negative values currently use the default of 0.
      schema:
        type: integer
        format: int32
        default: 0
        nullable: false
    Size:
      name: size
      in: query
      required: false
      description: Requested number of Companies per page. Missing, malformed, or nonpositive values use the default of 100; values above 2000 are capped at 2000.
      schema:
        type: integer
        format: int32
        default: 100
        nullable: false
    Sort:
      name: sort
      in: query
      required: false
      description: Sort criterion in `property,direction` form. Repeat the parameter for multiple criteria. Direction is `asc` or `desc`; when omitted, ascending order is used.
      style: form
      explode: true
      schema:
        type: array
        nullable: false
        items:
          type: string
      example:
        - title,asc
  responses:
    BadRequest:
      description: The path, query parameters, or request body are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: A valid JWT was not supplied. The current response has no body.
    Forbidden:
      description: The authenticated principal is not allowed to perform the operation. The current response has no body.
    CompanyNotFound:
      description: The requested Company does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CompanyConflict:
      description: Another Company already has the requested title.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    EmployeeNotFound:
      description: The requested Employee does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UserBindingConflict:
      description: The requested User is already bound to a different Employee.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftSessionResourceNotFound:
      description: A referenced Company or Shift Session does not exist, or no opened Shift Session exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ShiftSessionConflict:
      description: The authenticated User is not associated with the Company, the Shift Session is not in a state allowed by the operation, or multiple opened sessions exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CheckpointResourceNotFound:
      description: A referenced Checkpoint, Shift Session, or Company does not exist. Deleting an unknown Checkpoint remains successful; deletion returns this response only if an existing Checkpoint refers to a missing Shift Session or Company.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CheckpointConflict:
      description: The authenticated User is not associated with the Company, or the Shift Session state does not allow its Checkpoints to be modified.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Company:
      type: object
      description: A work location whose Shift Sessions and Payroll are accounted independently.
      additionalProperties: false
      required:
        - id
        - title
        - employeeWageCoefficientFromRevenue
        - defaultShiftStartTime
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Company's identifier.
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: false
          description: The unique display title of the Company.
          example: Central Cafe
        employeeWageCoefficientFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: The Company's Revenue Percentage expressed as a whole-number percentage.
          example: 15
        defaultShiftStartTime:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
          nullable: false
          description: Default local Shift Session Start time in 24-hour `HH:mm` form.
          example: '09:00'
    CompanyCreateOrUpdateRequest:
      type: object
      description: Fields required to create or update a Company.
      additionalProperties: false
      required:
        - title
        - employeeWageCoefficientFromRevenue
        - defaultShiftStartTime
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          nullable: false
          description: The unique display title of the Company.
          example: Central Cafe
        employeeWageCoefficientFromRevenue:
          type: integer
          format: int32
          nullable: false
          description: The Company's Revenue Percentage expressed as a whole-number percentage.
          example: 15
        defaultShiftStartTime:
          type: string
          minLength: 5
          maxLength: 5
          pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]$
          nullable: false
          description: Default local Shift Session Start time in 24-hour `HH:mm` form.
          example: '09:00'
    UserCompaniesResponse:
      type: object
      description: Companies associated with the authenticated User's Employee record.
      additionalProperties: false
      required:
        - companies
      properties:
        companies:
          type: array
          nullable: false
          items:
            $ref: '#/components/schemas/Company'
    CompanyPage:
      type: object
      description: Stable Company pagination fields. The server can emit additional framework metadata, which consumers must not rely on.
      additionalProperties: true
      required:
        - content
        - number
        - size
        - totalElements
      properties:
        content:
          type: array
          nullable: false
          description: Companies in this page.
          items:
            $ref: '#/components/schemas/Company'
        number:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          description: Zero-based page index.
          example: 0
        size:
          type: integer
          format: int32
          minimum: 0
          nullable: false
          description: Requested page size, or zero for an unpaged response.
          example: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
          nullable: false
          description: Total number of Companies across all pages.
          example: 2
    Position:
      type: string
      description: The Employee's operational designation; it does not grant system permissions.
      nullable: false
      enum:
        - MANAGER
        - WAITER_ACTIVE
        - WAITER_INACTIVE
      example: WAITER_ACTIVE
    Employee:
      type: object
      description: A person whose work and pay are accounted by Companies. The current API also permits an Employee to exist without a Company membership.
      additionalProperties: false
      required:
        - id
        - companyIds
        - userId
        - firstName
        - lastName
        - patronymic
        - simpleName
        - position
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
          example: 6a3c626f-0d0f-41d8-9818-06d263b25695
        companyIds:
          type: array
          nullable: false
          description: Identifiers of the Companies whose membership includes this Employee.
          items:
            type: string
            format: uuid
            nullable: false
          example:
            - 9b66d829-8909-4399-bbbe-8ad4b14b9251
        userId:
          type: string
          nullable: true
          description: The bound User's external identifier, or null when no User is bound.
          example: keycloak-user-123
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
          example: Ivan
        lastName:
          type: string
          nullable: false
          description: The Employee's family name.
          example: Ivanov
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    CompanyEmployee:
      type: object
      description: Employee details returned within one Company grouping.
      additionalProperties: false
      required:
        - id
        - userId
        - firstName
        - lastName
        - patronymic
        - simpleName
        - position
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
          example: 6a3c626f-0d0f-41d8-9818-06d263b25695
        userId:
          type: string
          nullable: true
          description: The bound User's external identifier, or null when no User is bound.
          example: keycloak-user-123
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
          example: Ivan
        lastName:
          type: string
          nullable: false
          description: The Employee's family name.
          example: Ivanov
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    CompanyEmployees:
      type: object
      description: Employees whose membership includes one Company.
      additionalProperties: false
      required:
        - companyId
        - data
      properties:
        companyId:
          type: string
          format: uuid
          nullable: false
          description: The Company's identifier.
          example: 9b66d829-8909-4399-bbbe-8ad4b14b9251
        data:
          type: array
          nullable: false
          minItems: 1
          description: Employees belonging to this Company.
          items:
            $ref: '#/components/schemas/CompanyEmployee'
    CreateEmployeeRequest:
      type: object
      description: Fields used to create an Employee and establish initial Company memberships.
      additionalProperties: false
      required:
        - firstName
        - lastName
        - patronymic
        - position
      properties:
        companyIds:
          type: array
          nullable: false
          default: []
          description: Identifiers of the Companies the new Employee belongs to. Omission creates the Employee without Company membership.
          items:
            type: string
            format: uuid
            nullable: false
          example:
            - 9b66d829-8909-4399-bbbe-8ad4b14b9251
        firstName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's first name; it must contain a non-whitespace character.
          example: Ivan
        lastName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's family name; it must contain a non-whitespace character.
          example: Ivanov
        patronymic:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's patronymic; it must contain a non-whitespace character.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    UpdateEmployeeRequest:
      type: object
      description: Fields used to replace an Employee's editable details and complete Company membership list. A null or omitted `userId` removes any existing User binding.
      additionalProperties: false
      required:
        - firstName
        - lastName
        - patronymic
        - position
      properties:
        companyIds:
          type: array
          nullable: false
          default: []
          description: Complete replacement list of Company memberships. Omission removes all Company memberships.
          items:
            type: string
            format: uuid
            nullable: false
          example:
            - 9b66d829-8909-4399-bbbe-8ad4b14b9251
        userId:
          type: string
          nullable: true
          description: External identifier of the User to bind, or null/omitted to remove the current binding. A non-null value must be unique across Employees.
          example: keycloak-user-123
        firstName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's first name; it must contain a non-whitespace character.
          example: Ivan
        lastName:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's family name; it must contain a non-whitespace character.
          example: Ivanov
        patronymic:
          type: string
          minLength: 1
          pattern: \S
          nullable: false
          description: The Employee's patronymic; it must contain a non-whitespace character.
          example: Ivanovich
        simpleName:
          type: string
          nullable: true
          description: An optional short display name for the Employee.
          example: Vanya
        position:
          $ref: '#/components/schemas/Position'
    ProblemDetail:
      type: object
      description: RFC 7807 problem details returned for application-level errors.
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri-reference
          nullable: false
          description: Identifier for the problem type; currently `about:blank`.
          example: about:blank
        title:
          type: string
          nullable: false
          description: Short HTTP status phrase.
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          nullable: false
          description: HTTP status code.
          example: 404
        detail:
          type: string
          nullable: false
          description: Human-readable explanation specific to this occurrence.
          example: Company 5b367932-2e5d-4d89-aa07-17f65ff4af9c not found
        instance:
          type: string
          format: uri-reference
          nullable: false
          description: Request path associated with this occurrence when supplied by the server.
          example: /api/v1/company/get/5b367932-2e5d-4d89-aa07-17f65ff4af9c
    ShiftSession:
      type: object
      description: One Company's work accounting session. Its `date` and `startWorkTime` together represent the Shift Session Start; that start is not a Checkpoint. Checkpoints are returned in ascending `dateTime` order.
      additionalProperties: false
      required:
        - id
        - companyId
        - startWorkTime
        - date
        - status
        - checkpoints
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Shift Session's identifier.
        companyId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Company whose work is accounted.
        startWorkTime:
          type: string
          format: time
          nullable: false
          description: Local time portion of the Shift Session Start.
          example: '09:00:00'
        date:
          type: string
          format: date
          nullable: false
          description: Local date portion of the Shift Session Start.
          example: '2026-08-13'
        status:
          $ref: '#/components/schemas/ShiftSessionStatus'
        checkpoints:
          type: array
          nullable: false
          description: Checkpoints ordered by their local date and time, possibly empty.
          items:
            $ref: '#/components/schemas/Checkpoint'
    ShiftSessionStatus:
      type: string
      nullable: false
      description: Current lifecycle state. `OPENED` and `RECALCULATING` allow Checkpoint and Shift Session Start changes. Their `_DRAFT` forms indicate that a Shift Result Draft exists. `CLOSED` is eligible to be reopened for Recalculation.
      enum:
        - OPENED
        - CLOSED
        - RECALCULATING
        - OPENED_DRAFT
        - RECALCULATING_DRAFT
    LocalDateTime:
      type: string
      format: local-date-time
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]{1,9})?)?$
      nullable: false
      description: A local date and time serialized without a UTC offset.
      example: '2026-08-13T09:00:00'
    ShiftSessionStart:
      description: The initial local date and time boundary of a Shift Session. It starts the first Shift Interval but is not a Checkpoint. The current API serializes this value without a UTC offset.
      allOf:
        - $ref: '#/components/schemas/LocalDateTime'
    OpenShiftSessionRequest:
      type: object
      description: Values required to open a new Shift Session for a Company.
      additionalProperties: false
      required:
        - companyId
        - startWorkAt
      properties:
        companyId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Company for the new Shift Session.
        startWorkAt:
          $ref: '#/components/schemas/ShiftSessionStart'
    OpenShiftSessionRecalculationRequest:
      type: object
      description: Selects the closed Shift Session to reopen for Recalculation.
      additionalProperties: false
      required:
        - closedSessionId
      properties:
        closedSessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of a Shift Session whose current status is `CLOSED`.
    UpdateShiftSessionStartRequest:
      type: object
      description: Updates the local time portion of an existing Shift Session Start.
      additionalProperties: false
      required:
        - sessionId
        - startWorkTime
      properties:
        sessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Session to update.
        startWorkTime:
          type: string
          format: time
          nullable: false
          description: Replacement local start time; the Shift Session date is unchanged.
          example: '10:30:00'
    Checkpoint:
      description: A boundary that ends a Shift Interval and records the team together with the Company's accumulated Revenue and Restaurant Tips at that time. A Checkpoint's team accounts for the Shift Interval that the Checkpoint ends.
      oneOf:
        - $ref: '#/components/schemas/RegularCheckpoint'
        - $ref: '#/components/schemas/FinalCheckpoint'
      discriminator:
        propertyName: type
        mapping:
          REGULAR: '#/components/schemas/RegularCheckpoint'
          FINAL: '#/components/schemas/FinalCheckpoint'
    CheckpointFields:
      type: object
      description: Fields shared by Regular and Final Checkpoints.
      additionalProperties: false
      required:
        - id
        - tips
        - revenue
        - employees
        - dateTime
        - type
        - metricRecords
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Checkpoint's identifier.
        tips:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Restaurant Tips in whole Russian rubles.
          example: 1200
        revenue:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Revenue in whole Russian rubles.
          example: 18000
        employees:
          type: array
          nullable: false
          description: The Employee team credited with the Shift Interval ending here.
          items:
            $ref: '#/components/schemas/CheckpointEmployee'
        dateTime:
          description: Local date and time of the boundary. The current API serializes this value without a UTC offset.
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
        type:
          $ref: '#/components/schemas/CheckpointType'
        metricRecords:
          type: array
          nullable: false
          description: Additional amounts assigned to Revenue or Restaurant Tips.
          items:
            $ref: '#/components/schemas/CheckpointMetricRecord'
    RegularCheckpoint:
      description: A Regular Checkpoint is followed by another Shift Interval in the same Shift Session.
      allOf:
        - $ref: '#/components/schemas/CheckpointFields'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              nullable: false
              enum:
                - REGULAR
    FinalCheckpoint:
      description: A Final Checkpoint is the last Checkpoint in a Shift Session. It has the same serialized shape and allocation rules as a Regular Checkpoint.
      allOf:
        - $ref: '#/components/schemas/CheckpointFields'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              nullable: false
              enum:
                - FINAL
    CheckpointType:
      type: string
      nullable: false
      description: Whether this is a Regular Checkpoint or the Final Checkpoint.
      enum:
        - REGULAR
        - FINAL
    CheckpointEmployee:
      type: object
      description: An Employee in the team recorded at a Checkpoint.
      additionalProperties: false
      required:
        - id
        - userId
        - firstName
        - lastName
        - patronymic
        - simpleName
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The Employee's identifier.
        userId:
          type: string
          nullable: true
          description: Linked authenticated User identifier, or null when none is linked.
        firstName:
          type: string
          nullable: false
          description: The Employee's first name.
        lastName:
          type: string
          nullable: false
          description: The Employee's last name.
        patronymic:
          type: string
          nullable: false
          description: The Employee's patronymic.
        simpleName:
          type: string
          nullable: true
          description: Optional short display name.
    CheckpointMetricRecord:
      type: object
      description: An additional recorded amount included in Checkpoint calculation inputs.
      additionalProperties: false
      required:
        - id
        - label
        - destination
        - value
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: The metric record's identifier.
        label:
          type: string
          nullable: false
          description: Display label supplied for the recorded amount.
        destination:
          $ref: '#/components/schemas/CheckpointMetricDestination'
        value:
          type: integer
          format: int32
          nullable: false
          description: Amount in whole Russian rubles.
    CheckpointMetricRecordRequest:
      type: object
      description: An additional amount to store with a Checkpoint.
      additionalProperties: false
      required:
        - label
        - destination
        - value
      properties:
        label:
          type: string
          nullable: false
          description: Display label for the recorded amount.
        destination:
          $ref: '#/components/schemas/CheckpointMetricDestination'
        value:
          type: integer
          format: int32
          nullable: false
          description: Amount in whole Russian rubles.
    CheckpointMetricDestination:
      type: string
      nullable: false
      description: Accumulated total to which a Checkpoint metric record belongs.
      enum:
        - REVENUE
        - TIPS
    CreateCheckpointRequest:
      type: object
      description: Complete serialized payload for creating a Checkpoint. The supplied team and accumulated totals describe the Shift Interval that this boundary ends.
      additionalProperties: false
      required:
        - sessionId
        - revenue
        - tips
        - employeeIds
        - dateTime
        - type
        - fieldRecords
      properties:
        sessionId:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Shift Session receiving the Checkpoint.
        revenue:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Revenue in whole Russian rubles.
        tips:
          type: integer
          format: int32
          nullable: false
          description: Accumulated Restaurant Tips in whole Russian rubles.
        employeeIds:
          type: array
          uniqueItems: true
          nullable: false
          description: Identifiers of the Employee team for the ended Shift Interval.
          items:
            type: string
            format: uuid
            nullable: false
        dateTime:
          description: Local Checkpoint date and time without a UTC offset in the current API.
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
        type:
          $ref: '#/components/schemas/CheckpointType'
        fieldRecords:
          type: array
          nullable: false
          description: Additional amounts assigned to Revenue or Restaurant Tips.
          items:
            $ref: '#/components/schemas/CheckpointMetricRecordRequest'
    UpdateCheckpointRequest:
      type: object
      description: Complete replacement payload for a Checkpoint, including its team, accumulated Revenue, accumulated Restaurant Tips, type, time, and metric records.
      additionalProperties: false
      required:
        - id
        - revenue
        - tips
        - employeeIds
        - dateTime
        - type
        - fieldRecords
      properties:
        id:
          type: string
          format: uuid
          nullable: false
          description: Identifier of the Checkpoint to replace.
        revenue:
          type: integer
          format: int32
          nullable: false
          description: Replacement accumulated Revenue in whole Russian rubles.
        tips:
          type: integer
          format: int32
          nullable: false
          description: Replacement accumulated Restaurant Tips in whole Russian rubles.
        employeeIds:
          type: array
          uniqueItems: true
          nullable: false
          description: Replacement Employee team for the ended Shift Interval.
          items:
            type: string
            format: uuid
            nullable: false
        dateTime:
          description: Replacement local Checkpoint date and time without a UTC offset in the current API.
          allOf:
            - $ref: '#/components/schemas/LocalDateTime'
        type:
          $ref: '#/components/schemas/CheckpointType'
        fieldRecords:
          type: array
          nullable: false
          description: Replacement additional Revenue and Restaurant Tips amounts.
          items:
            $ref: '#/components/schemas/CheckpointMetricRecordRequest'
