Company:
  type: object
  description: A work location whose Shift Sessions and Payroll are accounted independently.
  additionalProperties: false
  required:
    - id
    - title
    - employeeWageCoefficientFromRevenue
    - defaultShiftStartTime
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Company's identifier.
    title:
      type: string
      minLength: 1
      maxLength: 255
      nullable: false
      description: The unique display title of the Company.
      example: Central Cafe
    employeeWageCoefficientFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: The Company's Revenue Percentage expressed as a whole-number percentage.
      example: 15
    defaultShiftStartTime:
      type: string
      minLength: 5
      maxLength: 5
      pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
      nullable: false
      description: Default local Shift Session Start time in 24-hour `HH:mm` form.
      example: "09:00"

CompanyCreateOrUpdateRequest:
  type: object
  description: Fields required to create or update a Company.
  additionalProperties: false
  required:
    - title
    - employeeWageCoefficientFromRevenue
    - defaultShiftStartTime
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 255
      nullable: false
      description: The unique display title of the Company.
      example: Central Cafe
    employeeWageCoefficientFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: The Company's Revenue Percentage expressed as a whole-number percentage.
      example: 15
    defaultShiftStartTime:
      type: string
      minLength: 5
      maxLength: 5
      pattern: "^([0-1][0-9]|2[0-3]):[0-5][0-9]$"
      nullable: false
      description: Default local Shift Session Start time in 24-hour `HH:mm` form.
      example: "09:00"

UserCompaniesResponse:
  type: object
  description: Companies associated with the authenticated User's Employee record.
  additionalProperties: false
  required:
    - companies
  properties:
    companies:
      type: array
      nullable: false
      items:
        $ref: "#/Company"

CompanyPage:
  type: object
  description: >-
    Stable Company pagination fields. The server can emit additional framework
    metadata, which consumers must not rely on.
  additionalProperties: true
  required:
    - content
    - number
    - size
    - totalElements
  properties:
    content:
      type: array
      nullable: false
      description: Companies in this page.
      items:
        $ref: "#/Company"
    number:
      type: integer
      format: int32
      minimum: 0
      nullable: false
      description: Zero-based page index.
      example: 0
    size:
      type: integer
      format: int32
      minimum: 0
      nullable: false
      description: Requested page size, or zero for an unpaged response.
      example: 100
    totalElements:
      type: integer
      format: int64
      minimum: 0
      nullable: false
      description: Total number of Companies across all pages.
      example: 2

Position:
  type: string
  description: The Employee's operational designation; it does not grant system permissions.
  nullable: false
  enum:
    - MANAGER
    - WAITER_ACTIVE
    - WAITER_INACTIVE
  example: WAITER_ACTIVE

Employee:
  type: object
  description: >-
    A person whose work and pay are accounted by Companies. The current API also
    permits an Employee to exist without a Company membership.
  additionalProperties: false
  required:
    - id
    - companyIds
    - userId
    - firstName
    - lastName
    - patronymic
    - simpleName
    - position
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Employee's identifier.
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    companyIds:
      type: array
      nullable: false
      description: Identifiers of the Companies whose membership includes this Employee.
      items:
        type: string
        format: uuid
        nullable: false
      example:
        - 9b66d829-8909-4399-bbbe-8ad4b14b9251
    userId:
      type: string
      nullable: true
      description: The bound User's external identifier, or null when no User is bound.
      example: keycloak-user-123
    firstName:
      type: string
      nullable: false
      description: The Employee's first name.
      example: Ivan
    lastName:
      type: string
      nullable: false
      description: The Employee's family name.
      example: Ivanov
    patronymic:
      type: string
      nullable: false
      description: The Employee's patronymic.
      example: Ivanovich
    simpleName:
      type: string
      nullable: true
      description: An optional short display name for the Employee.
      example: Vanya
    position:
      $ref: "#/Position"

CompanyEmployee:
  type: object
  description: Employee details returned within one Company grouping.
  additionalProperties: false
  required:
    - id
    - userId
    - firstName
    - lastName
    - patronymic
    - simpleName
    - position
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Employee's identifier.
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    userId:
      type: string
      nullable: true
      description: The bound User's external identifier, or null when no User is bound.
      example: keycloak-user-123
    firstName:
      type: string
      nullable: false
      description: The Employee's first name.
      example: Ivan
    lastName:
      type: string
      nullable: false
      description: The Employee's family name.
      example: Ivanov
    patronymic:
      type: string
      nullable: false
      description: The Employee's patronymic.
      example: Ivanovich
    simpleName:
      type: string
      nullable: true
      description: An optional short display name for the Employee.
      example: Vanya
    position:
      $ref: "#/Position"

CompanyEmployees:
  type: object
  description: Employees whose membership includes one Company.
  additionalProperties: false
  required:
    - companyId
    - data
  properties:
    companyId:
      type: string
      format: uuid
      nullable: false
      description: The Company's identifier.
      example: 9b66d829-8909-4399-bbbe-8ad4b14b9251
    data:
      type: array
      nullable: false
      minItems: 1
      description: Employees belonging to this Company.
      items:
        $ref: "#/CompanyEmployee"

CreateEmployeeRequest:
  type: object
  description: Fields used to create an Employee and establish initial Company memberships.
  additionalProperties: false
  required:
    - firstName
    - lastName
    - patronymic
    - position
  properties:
    companyIds:
      type: array
      nullable: false
      default: []
      description: >-
        Identifiers of the Companies the new Employee belongs to. Omission creates
        the Employee without Company membership.
      items:
        type: string
        format: uuid
        nullable: false
      example:
        - 9b66d829-8909-4399-bbbe-8ad4b14b9251
    firstName:
      type: string
      minLength: 1
      pattern: '\S'
      nullable: false
      description: The Employee's first name; it must contain a non-whitespace character.
      example: Ivan
    lastName:
      type: string
      minLength: 1
      pattern: '\S'
      nullable: false
      description: The Employee's family name; it must contain a non-whitespace character.
      example: Ivanov
    patronymic:
      type: string
      minLength: 1
      pattern: '\S'
      nullable: false
      description: The Employee's patronymic; it must contain a non-whitespace character.
      example: Ivanovich
    simpleName:
      type: string
      nullable: true
      description: An optional short display name for the Employee.
      example: Vanya
    position:
      $ref: "#/Position"

UpdateEmployeeRequest:
  type: object
  description: >-
    Fields used to replace an Employee's editable details and complete Company
    membership list. A null or omitted `userId` removes any existing User binding.
  additionalProperties: false
  required:
    - firstName
    - lastName
    - patronymic
    - position
  properties:
    companyIds:
      type: array
      nullable: false
      default: []
      description: >-
        Complete replacement list of Company memberships. Omission removes all
        Company memberships.
      items:
        type: string
        format: uuid
        nullable: false
      example:
        - 9b66d829-8909-4399-bbbe-8ad4b14b9251
    userId:
      type: string
      nullable: true
      description: >-
        External identifier of the User to bind, or null/omitted to remove the
        current binding. A non-null value must be unique across Employees.
      example: keycloak-user-123
    firstName:
      type: string
      minLength: 1
      pattern: '\S'
      nullable: false
      description: The Employee's first name; it must contain a non-whitespace character.
      example: Ivan
    lastName:
      type: string
      minLength: 1
      pattern: '\S'
      nullable: false
      description: The Employee's family name; it must contain a non-whitespace character.
      example: Ivanov
    patronymic:
      type: string
      minLength: 1
      pattern: '\S'
      nullable: false
      description: The Employee's patronymic; it must contain a non-whitespace character.
      example: Ivanovich
    simpleName:
      type: string
      nullable: true
      description: An optional short display name for the Employee.
      example: Vanya
    position:
      $ref: "#/Position"

ProblemDetail:
  type: object
  description: RFC 7807 problem details returned for application-level errors.
  additionalProperties: true
  required:
    - type
    - title
    - status
    - detail
  properties:
    type:
      type: string
      format: uri-reference
      nullable: false
      description: Identifier for the problem type; currently `about:blank`.
      example: about:blank
    title:
      type: string
      nullable: false
      description: Short HTTP status phrase.
      example: Not Found
    status:
      type: integer
      format: int32
      minimum: 400
      maximum: 599
      nullable: false
      description: HTTP status code.
      example: 404
    detail:
      type: string
      nullable: false
      description: Human-readable explanation specific to this occurrence.
      example: Company 5b367932-2e5d-4d89-aa07-17f65ff4af9c not found
    instance:
      type: string
      format: uri-reference
      nullable: false
      description: Request path associated with this occurrence when supplied by the server.
      example: /api/v1/company/get/5b367932-2e5d-4d89-aa07-17f65ff4af9c

ShiftSession:
  type: object
  description: >-
    One Company's work accounting session. Its `date` and `startWorkTime`
    together represent the Shift Session Start; that start is not a Checkpoint.
    Checkpoints are returned in ascending `dateTime` order.
  additionalProperties: false
  required:
    - id
    - companyId
    - startWorkTime
    - date
    - status
    - checkpoints
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Shift Session's identifier.
    companyId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Company whose work is accounted.
    startWorkTime:
      type: string
      format: time
      nullable: false
      description: Local time portion of the Shift Session Start.
      example: "09:00:00"
    date:
      type: string
      format: date
      nullable: false
      description: Local date portion of the Shift Session Start.
      example: "2026-08-13"
    status:
      $ref: "#/ShiftSessionStatus"
    checkpoints:
      type: array
      nullable: false
      description: Checkpoints ordered by their local date and time, possibly empty.
      items:
        $ref: "#/Checkpoint"

ShiftSessionStatus:
  type: string
  nullable: false
  description: >-
    Current lifecycle state. `OPENED` and `RECALCULATING` allow Checkpoint and
    Shift Session Start changes. Their `_DRAFT` forms indicate that a Shift
    Result Draft exists. `CLOSED` is eligible to be reopened for Recalculation.
  enum:
    - OPENED
    - CLOSED
    - RECALCULATING
    - OPENED_DRAFT
    - RECALCULATING_DRAFT

LocalDateTime:
  type: string
  format: local-date-time
  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2}(\\.[0-9]{1,9})?)?$"
  nullable: false
  description: A local date and time serialized without a UTC offset.
  example: "2026-08-13T09:00:00"

ShiftSessionStart:
  description: >-
    The initial local date and time boundary of a Shift Session. It starts the
    first Shift Interval but is not a Checkpoint. The current API serializes this
    value without a UTC offset.
  allOf:
    - $ref: "#/LocalDateTime"

OpenShiftSessionRequest:
  type: object
  description: Values required to open a new Shift Session for a Company.
  additionalProperties: false
  required:
    - companyId
    - startWorkAt
  properties:
    companyId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Company for the new Shift Session.
    startWorkAt:
      $ref: "#/ShiftSessionStart"

OpenShiftSessionRecalculationRequest:
  type: object
  description: Selects the closed Shift Session to reopen for Recalculation.
  additionalProperties: false
  required:
    - closedSessionId
  properties:
    closedSessionId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of a Shift Session whose current status is `CLOSED`.

UpdateShiftSessionStartRequest:
  type: object
  description: Updates the local time portion of an existing Shift Session Start.
  additionalProperties: false
  required:
    - sessionId
    - startWorkTime
  properties:
    sessionId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Shift Session to update.
    startWorkTime:
      type: string
      format: time
      nullable: false
      description: Replacement local start time; the Shift Session date is unchanged.
      example: "10:30:00"

Checkpoint:
  description: >-
    A boundary that ends a Shift Interval and records the team together with the
    Company's accumulated Revenue and Restaurant Tips at that time. A Checkpoint's
    team accounts for the Shift Interval that the Checkpoint ends.
  oneOf:
    - $ref: "#/RegularCheckpoint"
    - $ref: "#/FinalCheckpoint"
  discriminator:
    propertyName: type
    mapping:
      REGULAR: "#/RegularCheckpoint"
      FINAL: "#/FinalCheckpoint"

CheckpointFields:
  type: object
  description: Fields shared by Regular and Final Checkpoints.
  additionalProperties: false
  required:
    - id
    - tips
    - revenue
    - employees
    - dateTime
    - type
    - metricRecords
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Checkpoint's identifier.
    tips:
      type: integer
      format: int32
      nullable: false
      description: Accumulated Restaurant Tips in whole Russian rubles.
      example: 1200
    revenue:
      type: integer
      format: int32
      nullable: false
      description: Accumulated Revenue in whole Russian rubles.
      example: 18000
    employees:
      type: array
      nullable: false
      description: The Employee team credited with the Shift Interval ending here.
      items:
        $ref: "#/CheckpointEmployee"
    dateTime:
      description: >-
        Local date and time of the boundary. The current API serializes this value
        without a UTC offset.
      allOf:
        - $ref: "#/LocalDateTime"
    type:
      $ref: "#/CheckpointType"
    metricRecords:
      type: array
      nullable: false
      description: Additional amounts assigned to Revenue or Restaurant Tips.
      items:
        $ref: "#/CheckpointMetricRecord"

RegularCheckpoint:
  description: A Regular Checkpoint is followed by another Shift Interval in the same Shift Session.
  allOf:
    - $ref: "#/CheckpointFields"
    - type: object
      required:
        - type
      properties:
        type:
          type: string
          nullable: false
          enum:
            - REGULAR

FinalCheckpoint:
  description: >-
    A Final Checkpoint is the last Checkpoint in a Shift Session. It has the same
    serialized shape and allocation rules as a Regular Checkpoint.
  allOf:
    - $ref: "#/CheckpointFields"
    - type: object
      required:
        - type
      properties:
        type:
          type: string
          nullable: false
          enum:
            - FINAL

CheckpointType:
  type: string
  nullable: false
  description: Whether this is a Regular Checkpoint or the Final Checkpoint.
  enum:
    - REGULAR
    - FINAL

CheckpointEmployee:
  type: object
  description: An Employee in the team recorded at a Checkpoint.
  additionalProperties: false
  required:
    - id
    - userId
    - firstName
    - lastName
    - patronymic
    - simpleName
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Employee's identifier.
    userId:
      type: string
      nullable: true
      description: Linked authenticated User identifier, or null when none is linked.
    firstName:
      type: string
      nullable: false
      description: The Employee's first name.
    lastName:
      type: string
      nullable: false
      description: The Employee's last name.
    patronymic:
      type: string
      nullable: false
      description: The Employee's patronymic.
    simpleName:
      type: string
      nullable: true
      description: Optional short display name.

CheckpointMetricRecord:
  type: object
  description: An additional recorded amount included in Checkpoint calculation inputs.
  additionalProperties: false
  required:
    - id
    - label
    - destination
    - value
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The metric record's identifier.
    label:
      type: string
      nullable: false
      description: Display label supplied for the recorded amount.
    destination:
      $ref: "#/CheckpointMetricDestination"
    value:
      type: integer
      format: int32
      nullable: false
      description: Amount in whole Russian rubles.

CheckpointMetricRecordRequest:
  type: object
  description: An additional amount to store with a Checkpoint.
  additionalProperties: false
  required:
    - label
    - destination
    - value
  properties:
    label:
      type: string
      nullable: false
      description: Display label for the recorded amount.
    destination:
      $ref: "#/CheckpointMetricDestination"
    value:
      type: integer
      format: int32
      nullable: false
      description: Amount in whole Russian rubles.

CheckpointMetricDestination:
  type: string
  nullable: false
  description: Accumulated total to which a Checkpoint metric record belongs.
  enum:
    - REVENUE
    - TIPS

CreateCheckpointRequest:
  type: object
  description: >-
    Complete serialized payload for creating a Checkpoint. The supplied team and
    accumulated totals describe the Shift Interval that this boundary ends.
  additionalProperties: false
  required:
    - sessionId
    - revenue
    - tips
    - employeeIds
    - dateTime
    - type
    - fieldRecords
  properties:
    sessionId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Shift Session receiving the Checkpoint.
    revenue:
      type: integer
      format: int32
      nullable: false
      description: Accumulated Revenue in whole Russian rubles.
    tips:
      type: integer
      format: int32
      nullable: false
      description: Accumulated Restaurant Tips in whole Russian rubles.
    employeeIds:
      type: array
      uniqueItems: true
      nullable: false
      description: Identifiers of the Employee team for the ended Shift Interval.
      items:
        type: string
        format: uuid
        nullable: false
    dateTime:
      description: >-
        Local Checkpoint date and time without a UTC offset in the current API.
      allOf:
        - $ref: "#/LocalDateTime"
    type:
      $ref: "#/CheckpointType"
    fieldRecords:
      type: array
      nullable: false
      description: Additional amounts assigned to Revenue or Restaurant Tips.
      items:
        $ref: "#/CheckpointMetricRecordRequest"

UpdateCheckpointRequest:
  type: object
  description: >-
    Complete replacement payload for a Checkpoint, including its team, accumulated
    Revenue, accumulated Restaurant Tips, type, time, and metric records.
  additionalProperties: false
  required:
    - id
    - revenue
    - tips
    - employeeIds
    - dateTime
    - type
    - fieldRecords
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Checkpoint to replace.
    revenue:
      type: integer
      format: int32
      nullable: false
      description: Replacement accumulated Revenue in whole Russian rubles.
    tips:
      type: integer
      format: int32
      nullable: false
      description: Replacement accumulated Restaurant Tips in whole Russian rubles.
    employeeIds:
      type: array
      uniqueItems: true
      nullable: false
      description: Replacement Employee team for the ended Shift Interval.
      items:
        type: string
        format: uuid
        nullable: false
    dateTime:
      description: >-
        Replacement local Checkpoint date and time without a UTC offset in the current API.
      allOf:
        - $ref: "#/LocalDateTime"
    type:
      $ref: "#/CheckpointType"
    fieldRecords:
      type: array
      nullable: false
      description: Replacement additional Revenue and Restaurant Tips amounts.
      items:
        $ref: "#/CheckpointMetricRecordRequest"

ShiftResultDraft:
  type: object
  description: A provisional calculation of employee Payments that has not yet been confirmed.
  additionalProperties: false
  required: [id, payments, date, sessionId]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Shift Result Draft.
      example: 3d65c0d7-69d9-4797-b976-37125a931534
    payments:
      type: array
      nullable: false
      description: Provisional Payments calculated for the Shift Session team.
      items:
        $ref: "#/ShiftResultDraftPayment"
    date:
      type: string
      format: date
      nullable: false
      description: Local business date of the Shift Session.
      example: "2026-08-13"
    sessionId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Shift Session being calculated.
      example: a840e78e-856c-4d79-bf36-8963a04a1dcf

ShiftResultDraftPayment:
  type: object
  description: A provisional employee Payment calculated for a Shift Result Draft.
  additionalProperties: false
  required: [id, employee, percentFromRevenue, tips, workSeconds]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the provisional Payment.
      example: eb412773-eaf0-430f-8f60-9dbb7db89685
    employee:
      allOf:
        - $ref: "#/ShiftResultDraftEmployee"
      nullable: false
      description: Employee receiving the provisional Payment.
    percentFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: Percent from Revenue allocated to the Employee, in whole Russian rubles.
      example: 2400
    tips:
      type: integer
      format: int32
      nullable: false
      description: Employee Tips allocated to the Employee, in whole Russian rubles.
      example: 900
    workSeconds:
      type: integer
      format: int64
      nullable: false
      description: Employee work duration represented as whole seconds.
      example: 28800

ShiftResultDraftEmployee:
  type: object
  description: Employee identity displayed in a Shift Result Draft Payment.
  additionalProperties: false
  required: [id, firstName, lastName, patronymic, simpleName]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Employee.
      example: 68e13904-36df-4295-bfe8-d16e96652dc6
    firstName:
      type: string
      nullable: false
      description: Employee's first name.
      example: Anna
    lastName:
      type: string
      nullable: false
      description: Employee's last name.
      example: Petrova
    patronymic:
      type: string
      nullable: false
      description: Employee's patronymic.
      example: Sergeevna
    simpleName:
      type: string
      nullable: true
      description: Optional short display name. The field is present and can be null.
      example: Anya

ConfirmShiftResultDraftResponse:
  type: object
  description: Identifies the Shift Result created by confirming a Shift Result Draft.
  additionalProperties: false
  required: [resultId]
  properties:
    resultId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the created Shift Result.
      example: 981f843f-9e31-4628-a81f-0c98a88af97c

ShiftResult:
  type: object
  description: The confirmed set of employee Payments for one Company's Shift Session or Manual Override.
  additionalProperties: false
  required: [id, payments, date, sessionId, calculationSource]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Shift Result.
      example: 981f843f-9e31-4628-a81f-0c98a88af97c
    payments:
      type: array
      nullable: false
      description: Confirmed Payments in this Shift Result.
      items:
        $ref: "#/Payment"
    date:
      type: string
      format: date
      nullable: false
      description: Local business date covered by the Shift Result.
      example: "2026-08-13"
    sessionId:
      type: string
      format: uuid
      nullable: true
      description: >-
        Identifier of the Shift Session whose Draft was confirmed. It is null for
        a Shift Result saved as a Manual Override.
      example: a840e78e-856c-4d79-bf36-8963a04a1dcf
    calculationSource:
      allOf:
        - $ref: "#/CalculationSource"
      nullable: false
      description: Whether Payments came from confirmed Checkpoints or a Manual Override.

Payment:
  type: object
  description: An Employee's confirmed Percent from Revenue and Employee Tips in a Shift Result.
  additionalProperties: false
  required: [id, employee, percentFromRevenue, tips, workSeconds]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Payment.
      example: 266b450d-d474-4440-a7e5-abd6ce155984
    employee:
      allOf:
        - $ref: "#/PaymentEmployee"
      nullable: false
      description: Employee receiving the Payment.
    percentFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: Percent from Revenue allocated to the Employee, in whole Russian rubles.
      example: 2400
    tips:
      type: integer
      format: int32
      nullable: false
      description: Employee Tips allocated to the Employee, in whole Russian rubles.
      example: 900
    workSeconds:
      type: integer
      format: int64
      nullable: false
      description: Employee work duration represented as whole seconds.
      example: 28800

PaymentEmployee:
  type: object
  description: Employee identity displayed in a confirmed Payment.
  additionalProperties: false
  required: [id, firstName, lastName, patronymic, simpleName]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Employee.
      example: 68e13904-36df-4295-bfe8-d16e96652dc6
    firstName:
      type: string
      nullable: false
      description: Employee's first name.
      example: Anna
    lastName:
      type: string
      nullable: false
      description: Employee's last name.
      example: Petrova
    patronymic:
      type: string
      nullable: false
      description: Employee's patronymic.
      example: Sergeevna
    simpleName:
      type: string
      nullable: true
      description: Optional short display name. The field is present and can be null.
      example: Anya

CalculationSource:
  type: string
  nullable: false
  description: Source used to establish the Shift Result Payments.
  enum: [CHECKPOINTS, MANUAL_OVERRIDE]
  example: CHECKPOINTS

SaveManualOverrideShiftResultRequest:
  type: object
  description: >-
    Directly entered Payments used to save a Shift Result as a Manual Override.
    The calculation source is always `MANUAL_OVERRIDE` and is not accepted as input.
  additionalProperties: false
  required: [companyId, payments, date]
  properties:
    replacementId:
      type: string
      format: uuid
      nullable: true
      description: Optional identifier of an earlier Shift Result to delete before saving.
      example: 19ea2df0-caa1-40a0-9e2b-dd013131b3cd
    companyId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Company that owns the Shift Result.
      example: 5b367932-2e5d-4d89-aa07-17f65ff4af9c
    overwrite:
      type: boolean
      default: false
      nullable: false
      description: Whether to replace an existing Shift Result for the same Company and date.
      example: true
    payments:
      type: array
      nullable: false
      description: Directly entered Payments. Each Employee identifier must occur at most once.
      items:
        $ref: "#/ManualOverridePaymentRequest"
    date:
      type: string
      format: date
      nullable: false
      description: Local business date covered by the Manual Override.
      example: "2026-08-13"

ManualOverridePaymentRequest:
  type: object
  description: Directly entered Payment used in a Manual Override Shift Result.
  additionalProperties: false
  required: [employeeId, percentFromRevenue, tips, workSeconds]
  properties:
    employeeId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the Employee receiving the Payment.
      example: 68e13904-36df-4295-bfe8-d16e96652dc6
    percentFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: Directly entered Percent from Revenue, in whole Russian rubles.
      example: 2400
    tips:
      type: integer
      format: int32
      nullable: false
      description: Directly entered Employee Tips, in whole Russian rubles.
      example: 900
    workSeconds:
      type: integer
      format: int64
      nullable: false
      description: Directly entered Employee work duration represented as whole seconds.
      example: 28800

SaveManualOverrideShiftResultResponse:
  type: object
  description: Identifies the Shift Result saved as a Manual Override.
  additionalProperties: false
  required: [resultId]
  properties:
    resultId:
      type: string
      format: uuid
      nullable: false
      description: Identifier of the saved Shift Result.
      example: 981f843f-9e31-4628-a81f-0c98a88af97c

ShiftResultResponse:
  type: object
  description: A detailed Shift Result and the Shift Session from which it was calculated, when applicable.
  additionalProperties: false
  required: [shiftResult, session]
  properties:
    shiftResult:
      allOf:
        - $ref: "#/ShiftResult"
      nullable: false
      description: Confirmed Shift Result with detailed Payments.
    session:
      allOf:
        - $ref: "#/ShiftSession"
      nullable: true
      description: >-
        Shift Session associated with a checkpoint-calculated Shift Result. The
        field is present and null for a Manual Override.

ShiftResultPage:
  type: object
  description: >-
    Stable Shift Result pagination fields. The server can emit additional framework
    metadata, which consumers must not rely on.
  additionalProperties: true
  required: [content, number, size, totalElements]
  properties:
    content:
      type: array
      nullable: false
      description: Shift Results in this page.
      items:
        $ref: "#/ShiftResult"
    number:
      type: integer
      format: int32
      minimum: 0
      nullable: false
      description: Zero-based page index.
      example: 0
    size:
      type: integer
      format: int32
      minimum: 0
      nullable: false
      description: Requested page size, or zero for an unpaged response.
      example: 100
    totalElements:
      type: integer
      format: int64
      minimum: 0
      nullable: false
      description: Total number of Shift Results across all pages.
      example: 2

Payroll:
  type: object
  description: >-
    Employee Payments aggregated over one Payroll Period for a Company. Elements
    are ordered by date; the aggregation granularity depends on the amount of
    source data in the selected period.
  additionalProperties: false
  required: [type, elements, summaries]
  properties:
    type:
      $ref: "#/PayrollAggregation"
    elements:
      type: array
      nullable: false
      description: Date-ordered Payment groups at the selected aggregation granularity.
      items:
        $ref: "#/PayrollElement"
    summaries:
      type: array
      nullable: false
      description: Payroll totals grouped by Employee over the complete selected period.
      items:
        $ref: "#/EmployeePayrollSummary"

PayrollAggregation:
  type: string
  nullable: false
  description: >-
    Granularity of the Payroll elements. Daily data is returned for up to 31
    source elements, monthly data for more than 31 and up to three years of source
    elements, and yearly data beyond that threshold.
  enum: [BY_DAY, BY_MONTH, BY_YEAR]
  example: BY_DAY

PayrollElement:
  type: object
  description: Payments aggregated for one day, month, or year in a Payroll.
  additionalProperties: false
  required: [date, payments]
  properties:
    date:
      type: string
      format: date
      nullable: false
      description: >-
        The source day for daily aggregation, the first day of the month for
        monthly aggregation, or the first day of the year for yearly aggregation.
      example: "2026-01-01"
    payments:
      type: array
      nullable: false
      description: Payments for Employees represented in this element.
      items:
        $ref: "#/PayrollPayment"

PayrollPayment:
  type: object
  description: >-
    One Employee's Percent from Revenue and Employee Tips within a Payroll
    element. Monetary amounts are whole Russian rubles.
  additionalProperties: false
  required: [employee, percentFromRevenue, tips]
  properties:
    employee:
      allOf:
        - $ref: "#/PayrollEmployee"
      nullable: false
      description: Employee receiving the Payment.
    percentFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: The Employee's Percent from Revenue in whole Russian rubles.
      example: 2500
    tips:
      type: integer
      format: int32
      nullable: false
      description: The Employee Tips allocated to the Employee in whole Russian rubles.
      example: 1200

EmployeePayrollSummary:
  type: object
  description: One Employee's Payment totals over the complete Payroll Period.
  additionalProperties: false
  required: [employee, totalPercentFromRevenue, totalTips]
  properties:
    employee:
      allOf:
        - $ref: "#/PayrollEmployee"
      nullable: false
      description: Employee whose Payments are totaled.
    totalPercentFromRevenue:
      type: integer
      format: int32
      nullable: false
      description: Total Percent from Revenue in whole Russian rubles.
      example: 25000
    totalTips:
      type: integer
      format: int32
      nullable: false
      description: Total Employee Tips in whole Russian rubles.
      example: 12000

PayrollEmployee:
  type: object
  description: Employee identity embedded in a Payroll Payment or summary.
  additionalProperties: false
  required: [id, firstName, lastName, patronymic, simpleName]
  properties:
    id:
      type: string
      format: uuid
      nullable: false
      description: The Employee's identifier.
      example: 6a3c626f-0d0f-41d8-9818-06d263b25695
    firstName:
      type: string
      nullable: false
      description: The Employee's first name.
      example: Ivan
    lastName:
      type: string
      nullable: false
      description: The Employee's family name.
      example: Ivanov
    patronymic:
      type: string
      nullable: false
      description: The Employee's patronymic.
      example: Ivanovich
    simpleName:
      type: string
      nullable: true
      description: An optional short display name for the Employee.
      example: Vanya
