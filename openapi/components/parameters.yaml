CompanyId:
  name: id
  in: path
  required: true
  description: The Company's identifier.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 9b66d829-8909-4399-bbbe-8ad4b14b9251

EmployeeId:
  name: id
  in: path
  required: true
  description: The Employee's identifier.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 6a3c626f-0d0f-41d8-9818-06d263b25695

EmployeeBindingId:
  name: employeeId
  in: path
  required: true
  description: The identifier of the Employee to bind to a User.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 6a3c626f-0d0f-41d8-9818-06d263b25695

CompanyIds:
  name: companyIds
  in: query
  required: true
  description: >-
    One or more Company identifiers supplied as repeated `companyIds` parameters.
    Only Companies with at least one matching Employee are represented in the
    response.
  style: form
  explode: true
  schema:
    type: array
    minItems: 1
    nullable: false
    items:
      type: string
      format: uuid
      nullable: false
  example:
    - 9b66d829-8909-4399-bbbe-8ad4b14b9251

UserId:
  name: userId
  in: query
  required: true
  description: >-
    The external identifier of the User to bind. It must not already be bound to a
    different Employee.
  schema:
    type: string
    nullable: false
  example: keycloak-user-123

ShiftSessionCompanyId:
  name: companyId
  in: query
  required: true
  description: Identifier of the Company whose Shift Sessions are requested.
  schema:
    type: string
    format: uuid
    nullable: false

ShiftSessionId:
  name: sessionId
  in: path
  required: true
  description: The Shift Session's identifier.
  schema:
    type: string
    format: uuid
    nullable: false

CheckpointId:
  name: checkpointId
  in: path
  required: true
  description: The Checkpoint's identifier.
  schema:
    type: string
    format: uuid
    nullable: false

Page:
  name: page
  in: query
  required: false
  description: >-
    Zero-based page index. Missing, malformed, or negative values currently use
    the default of 0.
  schema:
    type: integer
    format: int32
    default: 0
    nullable: false

Size:
  name: size
  in: query
  required: false
  description: >-
    Requested number of Companies per page. Missing, malformed, or nonpositive
    values use the default of 100; values above 2000 are capped at 2000.
  schema:
    type: integer
    format: int32
    default: 100
    nullable: false

Sort:
  name: sort
  in: query
  required: false
  description: >-
    Sort criterion in `property,direction` form. Repeat the parameter for multiple
    criteria. Direction is `asc` or `desc`; when omitted, ascending order is used.
  style: form
  explode: true
  schema:
    type: array
    nullable: false
    items:
      type: string
  example:
    - title,asc
