CompanyId:
  name: id
  in: path
  required: true
  description: The Company's identifier.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 9b66d829-8909-4399-bbbe-8ad4b14b9251

EmployeeId:
  name: id
  in: path
  required: true
  description: The Employee's identifier.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 6a3c626f-0d0f-41d8-9818-06d263b25695

EmployeeBindingId:
  name: employeeId
  in: path
  required: true
  description: The identifier of the Employee to bind to a User.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 6a3c626f-0d0f-41d8-9818-06d263b25695

CompanyIds:
  name: companyIds
  in: query
  required: true
  description: >-
    One or more Company identifiers supplied as repeated `companyIds` parameters.
    Only Companies with at least one matching Employee are represented in the
    response.
  style: form
  explode: true
  schema:
    type: array
    minItems: 1
    nullable: false
    items:
      type: string
      format: uuid
      nullable: false
  example:
    - 9b66d829-8909-4399-bbbe-8ad4b14b9251

UserId:
  name: userId
  in: query
  required: true
  description: >-
    The external identifier of the User to bind. It must not already be bound to a
    different Employee.
  schema:
    type: string
    nullable: false
  example: keycloak-user-123

ShiftSessionCompanyId:
  name: companyId
  in: query
  required: true
  description: Identifier of the Company whose Shift Sessions are requested.
  schema:
    type: string
    format: uuid
    nullable: false

ShiftSessionId:
  name: sessionId
  in: path
  required: true
  description: The Shift Session's identifier.
  schema:
    type: string
    format: uuid
    nullable: false

CheckpointId:
  name: checkpointId
  in: path
  required: true
  description: The Checkpoint's identifier.
  schema:
    type: string
    format: uuid
    nullable: false

ShiftResultCompanyId:
  name: companyId
  in: query
  required: true
  description: Identifier of the Company whose Shift Results are requested.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 5b367932-2e5d-4d89-aa07-17f65ff4af9c

PayrollCompanyId:
  name: companyId
  in: query
  required: true
  description: Identifier of the Company whose Payroll is requested.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 9b66d829-8909-4399-bbbe-8ad4b14b9251

ShiftResultDraftId:
  name: id
  in: path
  required: true
  description: Identifier of the Shift Result Draft.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 3d65c0d7-69d9-4797-b976-37125a931534

ShiftResultId:
  name: resultId
  in: path
  required: true
  description: Identifier of the Shift Result.
  schema:
    type: string
    format: uuid
    nullable: false
  example: 981f843f-9e31-4628-a81f-0c98a88af97c

PeriodType:
  name: periodType
  in: query
  required: true
  description: >-
    Selects the requested Payroll Period. `CUSTOM` requires `start` and `end` and
    ignores `now`. `CURRENT` and `PREVIOUS` require `now` and ignore `start` and
    `end`. Standard periods cover either days 1 through 15 or day 16 through the
    last day of a calendar month.
  schema:
    type: string
    nullable: false
    enum:
      - CUSTOM
      - CURRENT
      - PREVIOUS
  example: CUSTOM

StartDate:
  name: start
  in: query
  required: false
  description: >-
    Inclusive first date of a `CUSTOM` Payroll Period. Required only when
    `periodType` is `CUSTOM`; otherwise ignored. It must not be after `end`.
  schema:
    type: string
    format: date
    nullable: false
  example: "2026-08-01"

EndDate:
  name: end
  in: query
  required: false
  description: >-
    Inclusive last date of a `CUSTOM` Payroll Period. Required only when
    `periodType` is `CUSTOM`; otherwise ignored. It must not be before `start`.
  schema:
    type: string
    format: date
    nullable: false
  example: "2026-08-15"

CurrentDate:
  name: now
  in: query
  required: false
  description: >-
    Reference date used to construct a `CURRENT` or `PREVIOUS` Payroll Period.
    Required for those period types; ignored for `CUSTOM`.
  schema:
    type: string
    format: date
    nullable: false
  example: "2026-08-13"

Page:
  name: page
  in: query
  required: false
  description: >-
    Zero-based page index. Missing, malformed, or negative values currently use
    the default of 0.
  schema:
    type: integer
    format: int32
    default: 0
    nullable: false

Size:
  name: size
  in: query
  required: false
  description: >-
    Requested number of resources per page. Missing, malformed, or nonpositive
    values use the default of 100; values above 2000 are capped at 2000.
  schema:
    type: integer
    format: int32
    default: 100
    nullable: false

ShiftResultPageIndex:
  name: page
  in: query
  required: false
  description: >-
    Zero-based decimal page index. Missing, malformed, or negative values use the
    default of 0. This parameter is represented as a string so the generated
    boundary can preserve that lenient coercion behavior.
  schema:
    type: string
    default: "0"
    nullable: false

ShiftResultPageSize:
  name: size
  in: query
  required: false
  description: >-
    Decimal number of Shift Results requested per page. Missing, malformed, or
    nonpositive values use the default of 100; values above 2000 are capped at
    2000. This parameter is represented as a string so the generated boundary can
    preserve that lenient coercion behavior.
  schema:
    type: string
    default: "100"
    nullable: false

CompanyPageIndex:
  name: page
  in: query
  required: false
  description: >-
    Zero-based decimal page index. Missing, malformed, or negative values use the
    default of 0. This parameter is represented as a string so the generated
    boundary can preserve that lenient coercion behavior.
  schema:
    type: string
    default: "0"
    nullable: false

CompanyPageSize:
  name: size
  in: query
  required: false
  description: >-
    Decimal number of Companies requested per page. Missing, malformed, or
    nonpositive values use the default of 100; values above 2000 are capped at
    2000. This parameter is represented as a string so the generated boundary can
    preserve that lenient coercion behavior.
  schema:
    type: string
    default: "100"
    nullable: false

Sort:
  name: sort
  in: query
  required: false
  description: >-
    Sort criterion in `property,direction` form. Repeat the parameter for multiple
    criteria. Direction is `asc` or `desc`; when omitted, ascending order is used.
  style: form
  explode: true
  schema:
    type: array
    nullable: false
    items:
      type: string
  example:
    - title,asc
