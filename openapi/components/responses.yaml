BadRequest:
  description: The path, query parameters, or request body are invalid.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

Unauthorized:
  description: A valid JWT was not supplied. The current response has no body.

Forbidden:
  description: The authenticated principal is not allowed to perform the operation. The current response has no body.

CompanyNotFound:
  description: The requested Company does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

CompanyConflict:
  description: Another Company already has the requested title.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftSessionResourceNotFound:
  description: A referenced Company or Shift Session does not exist, or no opened Shift Session exists.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

EmployeeNotFound:
  description: The requested Employee or a referenced Company does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftSessionConflict:
  description: >-
    The authenticated User is not associated with the Company, the Shift Session
    is not in a state allowed by the operation, or multiple opened sessions exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

CheckpointResourceNotFound:
  description: >-
    A referenced Checkpoint, Shift Session, Company, or Employee does not exist.
    Deleting an unknown Checkpoint remains successful; deletion returns this
    response only if an existing Checkpoint refers to a missing Shift Session or
    Company.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

CheckpointConflict:
  description: >-
    The authenticated User is not associated with the Company, or the Shift
    Session state does not allow its Checkpoints to be modified.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

UserBindingConflict:
  description: The requested User is already bound to a different Employee.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftResultDraftResourceNotFound:
  description: A referenced Shift Result Draft or Shift Session does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftResultResourceNotFound:
  description: A referenced Shift Result, Company, or Employee does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftResultDraftConflict:
  description: >-
    The Shift Session state does not allow the operation, or the authenticated User
    is not associated with the Shift Session's Company, or an existing Shift Result
    already occupies the Company's date.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftResultConflict:
  description: >-
    The operation conflicts with an existing Shift Result, duplicate Payment
    employees, or the authenticated User's Company associations.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

PayrollResourceNotFound:
  description: The requested Company or authenticated User's Employee record does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

PayrollConflict:
  description: The authenticated User is not associated with the requested Company.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail
