BadRequest:
  description: The path, query parameters, or request body are invalid.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

Unauthorized:
  description: A valid JWT was not supplied. The current response has no body.

Forbidden:
  description: The authenticated principal is not allowed to perform the operation. The current response has no body.

CompanyNotFound:
  description: The requested Company does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

CompanyConflict:
  description: Another Company already has the requested title.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftSessionResourceNotFound:
  description: A referenced Company or Shift Session does not exist, or no opened Shift Session exists.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

ShiftSessionConflict:
  description: >-
    The authenticated User is not associated with the Company, the Shift Session
    is not in a state allowed by the operation, or multiple opened sessions exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

CheckpointResourceNotFound:
  description: A referenced Checkpoint, Shift Session, or Company does not exist.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail

CheckpointConflict:
  description: >-
    The authenticated User is not associated with the Company, or the Shift
    Session state does not allow its Checkpoints to be modified.
  content:
    application/problem+json:
      schema:
        $ref: ./schemas.yaml#/ProblemDetail
